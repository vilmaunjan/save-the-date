name: Finalize mobile landscape fix

on:
  push:
    branches:
      - villa-scene-transition
    paths:
      - .github/workflows/finalize-mobile-landscape-fix.yml

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: villa-scene-transition

      - name: Ensure landscape villa overrides portrait rule
        shell: bash
        run: |
          python <<'PY'
          from pathlib import Path
          path = Path('index.html')
          text = path.read_text()
          anchor = """/* ---- LANDSCAPE iPAD: keep desktop's side-by-side layout, shrink villa ----"""
          override = '''/* Landscape-phone villa override must come AFTER the generic
             max-width:1024px portrait/tablet rule above so CSS source order does
             not pull the villa back underneath the text. */
          @media (orientation: landscape) and (max-height: 500px) and (max-width: 1000px) {
            .villa-image {
              top: 50%;
              left: auto;
              right: 4vw;
              margin: 0;
              width: min(34vw, 62dvh);
              max-width: none;
              transform: translateY(-50%) translateX(180%);
            }
          }

          '''
          if anchor not in text:
              raise SystemExit('Could not find landscape iPad anchor')
          text = text.replace(anchor, override + anchor, 1)
          path.write_text(text)
          PY

      - name: Commit final override and remove temporary workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/finalize-mobile-landscape-fix.yml
          git add index.html
          git commit -m "fix: preserve landscape phone villa layout"
          git push origin villa-scene-transition
