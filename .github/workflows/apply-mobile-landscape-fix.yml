name: Apply mobile landscape layout fix

on:
  push:
    branches:
      - villa-scene-transition
    paths:
      - .github/workflows/apply-mobile-landscape-fix.yml

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: villa-scene-transition

      - name: Add landscape-phone layout
        shell: python
        run: |
          from pathlib import Path

          path = Path('index.html')
          text = path.read_text()

          css_anchor = """/* ---- VILLA BELOW TEXT: phones AND tablets (not just phones) ----"""
          landscape_css = r'''/* ---- MOBILE LANDSCAPE ----
   A phone turned sideways is wide but very short, so the portrait
   "villa below the text" composition becomes vertically cramped.
   Use the available horizontal room instead: keep the save text on
   the left, put the villa on the right, and tighten purely decorative
   vertical elements. The max-height guard keeps this from changing
   iPad/tablet landscape layouts. */
@media (orientation: landscape) and (max-height: 500px) and (max-width: 1000px) {
  .from-block {
    top: 5dvh;
  }

  .from-eyebrow {
    margin-bottom: 1em;
  }

  .from-names {
    margin-top: 0.25em;
    font-size: clamp(2.6rem, 8vw, 4.2rem);
  }

  .open-line {
    bottom: 6dvh;
    font-size: clamp(0.72rem, 1.8vw, 0.95rem);
    letter-spacing: 0.28em;
  }

  .duque-rest {
    bottom: 9dvh;
    left: calc(68vw - 45px);
    width: clamp(70px, 15vw, 105px);
  }

  .envelope-photo {
    background-size: contain;
  }

  .monogram {
    top: 13%;
    width: clamp(76px, 12vw, 110px);
  }

  .monogram .mono-letter {
    font-size: clamp(2.2rem, 6vw, 3.5rem);
  }

  .save-block {
    left: 5vw;
    right: auto;
    top: 32%;
    width: 55vw;
  }

  .save-eyebrow {
    font-size: clamp(0.7rem, 1.7vw, 0.9rem);
    margin-bottom: 0.45em;
  }

  .save-tagline {
    font-size: clamp(3rem, 8vw, 5.2rem);
    margin-bottom: 0.25em;
  }

  .save-date {
    font-size: clamp(0.82rem, 1.8vw, 1.2rem);
    letter-spacing: 0.3em;
  }

  .villa-image {
    top: 50%;
    left: auto;
    right: 4vw;
    margin: 0;
    width: min(34vw, 62dvh);
    max-width: none;
    transform: translateY(-50%) translateX(180%);
  }

  .villa-caption {
    left: auto;
    right: 5vw;
    bottom: 5dvh;
    width: 36vw;
    font-size: clamp(0.82rem, 1.8vw, 1.1rem);
    letter-spacing: 0.28em;
  }

  .scroll-hint {
    bottom: 2.5dvh;
    font-size: 0.72rem;
  }

  .closing-section {
    min-height: 100dvh;
    gap: 1.25rem;
    padding-top: 2rem;
  }

  .countdown-num {
    font-size: clamp(1.7rem, 5vw, 2.4rem);
  }
}

'''
          if css_anchor not in text:
              raise SystemExit('Could not find CSS insertion anchor')
          text = text.replace(css_anchor, landscape_css + css_anchor, 1)

          old_js = """  const isNarrowLayout = window.matchMedia('(max-width: 1024px)').matches;
  const saveBlockShift = isNarrowLayout ? '0vw' : '-22vw';"""
          new_js = """  const isPhoneLandscape = window.matchMedia('(orientation: landscape) and (max-height: 500px) and (max-width: 1000px)').matches;
  const isNarrowLayout = window.matchMedia('(max-width: 1024px)').matches && !isPhoneLandscape;
  const saveBlockShift = isNarrowLayout ? '0vw' : (isPhoneLandscape ? '-4vw' : '-22vw');"""
          if old_js not in text:
              raise SystemExit('Could not find narrow-layout JS anchor')
          text = text.replace(old_js, new_js, 1)

          old_rise = """  const saveBlockRise = isNarrowLayout ? '-9vh' : '0vh';"""
          new_rise = """  const saveBlockRise = isNarrowLayout ? '-9vh' : '0vh';"""
          if old_rise not in text:
              raise SystemExit('Could not find saveBlockRise anchor')

          path.write_text(text)

      - name: Commit landscape fix and remove temporary workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/apply-mobile-landscape-fix.yml
          git add index.html
          git commit -m "fix: improve mobile landscape layout"
          git push origin villa-scene-transition
