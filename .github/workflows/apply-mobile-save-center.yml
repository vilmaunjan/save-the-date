name: Apply mobile save-date centering fix

on:
  push:
    branches:
      - villa-scene-transition
    paths:
      - .github/workflows/apply-mobile-save-center.yml

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: villa-scene-transition

      - name: Apply centering fix
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text()
          old = "left: 5vw;\n    right: auto;\n    top: 32%;\n    width: 55vw;"
          new = "left: 0;\n    right: 0;\n    top: 32%;\n    width: auto;"
          if old not in s:
              raise SystemExit('landscape save-block layout not found')
          s = s.replace(old, new, 1)
          old_shift = "isPhoneLandscape ? '-4vw' : '-22vw'"
          new_shift = "isPhoneLandscape ? '-20vw' : '-22vw'"
          if old_shift not in s:
              raise SystemExit('landscape save-block shift not found')
          s = s.replace(old_shift, new_shift, 1)
          p.write_text(s)
          PY

      - name: Commit result
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/apply-mobile-save-center.yml
          git add index.html
          git commit -m "fix: center save the date at mobile scroll start"
          git push origin villa-scene-transition
