name: Playwright Tests

on:
  push:
    branches: [master, test/add-playwright]
  pull_request:
    branches: [master]

jobs:
  test:
    timeout-minutes: 30
    runs-on: ubuntu-latest

    steps:
      - name: Check out current branch
        uses: actions/checkout@v4

      - name: Check out master baseline
        uses: actions/checkout@v4
        with:
          ref: master
          path: visual-baseline

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm install

      - name: Install Playwright browsers
        run: npx playwright install --with-deps

      - name: Run Playwright tests
        run: npm test

      - name: Run visual regression against master
        shell: bash
        run: |
          npx http-server visual-baseline -p 4173 -c-1 > /tmp/visual-baseline.log 2>&1 &
          BASE_SERVER_PID=$!
          npx http-server . -p 4174 -c-1 > /tmp/visual-current.log 2>&1 &
          CURRENT_SERVER_PID=$!
          trap 'kill $BASE_SERVER_PID $CURRENT_SERVER_PID 2>/dev/null || true' EXIT
          sleep 2
          npm run test:visual

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 14

      - name: Upload test artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-test-results
          path: test-results/
          retention-days: 14

      - name: Upload visual regression artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: visual-regression-results
          path: visual-regression-results/
          retention-days: 14
