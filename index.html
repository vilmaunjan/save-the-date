<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>A Love Letter — Edgar &amp; Vilma</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,400&family=EB+Garamond:ital,wght@0,400;0,500;1,400&family=Cinzel&family=Mrs+Saint+Delafield&display=swap" rel="stylesheet">
<style>
/* ---- TOKENS (same palette as villa.html, for continuity) ---- */
:root {
  --parchment: #F7F1E4;
  --clay:      #C97C5D;
  --stone:     #E6C79A;
  --sage:      #6C7C58;
  --sky:       #AFC9D6;
  --ink:       #3B322A;
  --gold:      #B8912F;
  /* Sampled directly from envelope.jpeg's own background border
     (averaged a handful of corner/edge pixels — landed on ~#EDE4DB
     consistently), so anything showing through around the envelope
     matches its paper color exactly instead of visibly seaming into
     the page's own (slightly different) sky/parchment tones. */
  --envelope-cream: #EDE4DB;
}

/* Registers --wipe (used by .sky-photo/.sky-scrim's dissolve-wipe mask)
   as an actual typed, animatable value instead of an opaque string.
   Without this, every GSAP update to --wipe forces the browser to
   re-parse the whole mask-image gradient from scratch as text; with
   it, the browser knows it's a real interpolatable <percentage> and
   can update it far more cheaply — meaningful given this animates on
   every scroll tick during the dissolve. */
@property --wipe {
  syntax: '<percentage>';
  inherits: false;
  initial-value: 0%;
}
/* Registers the two unitless 0→1 GSAP-animated drivers for the
   save-block scroll shift. GSAP tweens these from 0 to 1; the actual
   distances (--shift-x, --shift-y) live in CSS media queries and are
   multiplied in via calc() in the .save-block rule below. Without
   @property, GSAP would treat these as opaque strings and refuse to
   interpolate them as numbers. */
@property --shift-px {
  syntax: '<number>';
  inherits: false;
  initial-value: 0;
}
@property --shift-py {
  syntax: '<number>';
  inherits: false;
  initial-value: 0;
}

*, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

/* background: matches body, as a fallback behind the page.
   overscroll-behavior-y: none disables the browser's elastic bounce/
   rubber-band effect at the top/bottom of the scrollable range on
   trackpad/touch — that bounce is what was briefly exposing a gap
   behind the sky-scene, no matter what color sits behind it. Removing
   the bounce removes the gap entirely. */
html {
  height: 100%;
  background: var(--parchment);
  overscroll-behavior-y: none;
}

body {
  min-height: 100%;
  font-family: 'EB Garamond', serif;
  color: var(--ink);
  background: var(--parchment);
  overscroll-behavior-y: none;
  /* No text on this page is meant to be selected/copied — it's a
     click-through decorative site, not an article. Long-pressing on
     mobile was popping the selection highlight/callout menu, which
     read as broken rather than intentional. */
  -webkit-user-select: none;
  user-select: none;
  -webkit-touch-callout: none;
  /* Locked (no scroll) during the envelope intro — there's nothing to
     scroll to yet anyway, but this keeps it explicit. Unlocked by JS
     once the click reveal finishes, so scrolling down through
     .scroll-spacer fades the couple photo in behind the sky-scene text. */
  overflow: hidden;
  /* Hidden until JS confirms the scroll position is actually 0 and
     reveals it (see the script) — the browser can restore a previous
     scroll position and paint that frame before our own JS gets a
     chance to correct it, which is exactly the "flash mid-scroll, then
     jump to top" you were seeing. Hiding first means there's nothing to
     flash regardless of how that timing race plays out. */
  visibility: hidden;
}
body.unlocked { overflow: auto; }
body.revealed { visibility: visible; }

/* Wraps .stage + .scroll-spacer. Given a background purely so the
   strip revealed when a phone's browser bars slide away is filled.
   .stage is 100svh - the height with the bars SHOWING - deliberately,
   because svh never changes mid-gesture and GSAP caches its pin math
   once (dvh growing out from under those cached boundaries is the old
   "extra scroll" bug). The cost of that correct choice is that when the
   bars retract the window gets taller while .stage does not, exposing
   whatever is underneath below it.

   Before, that was html/body's parchment (#F7F1E4) sitting directly
   under the envelope screen's cream (#EDE4DB) - a visible colour break
   right where the bottom bar used to be, reported as content looking
   cut off above the bars. Painting this wrapper instead means the strip
   always matches whatever screen is above it.

   Two colours because the two screens differ: cream while the envelope
   is closed, parchment once it opens, since .sky-bg's gradient already
   resolves to parchment by 65% so the strip becomes invisible there.
   Transitioned rather than swapped so it moves with the 1.2s reveal
   crossfade instead of popping at the end of it. */
.couple-villa-scroll {
  background: var(--envelope-cream);
  transition: background-color 1.2s ease;
}
body.unlocked .couple-villa-scroll { background: var(--parchment); }

/* ---- STAGE: fills the first viewport (envelope intro + sky-scene reveal) ---- */
.stage {
  /* sticky, not relative — stays pinned at the top of the viewport as
     you scroll, same pattern as .viewport-pin on the main site, instead
     of scrolling away together with the photo underneath it. */
  position: sticky;
  top: 0;
  width: 100vw;
  /* Was 100dvh — dvh tracks the phone browser's toolbar live, which is
     exactly the problem: GSAP's ScrollTrigger caches its scroll-pin
     boundary math once (on setup), using whatever dvh happened to be
     at that moment. If the toolbar then collapses mid-scroll (a real
     mobile-Safari/Chrome behavior — iPad barely does this, which is
     why this bug reportedly doesn't show up there), dvh grows, but
     the CACHED boundaries don't — the pin now needs more real scroll
     distance to traverse than GSAP thinks it does, which is exactly
     "extra scroll after the content's already settled." svh is the
     smallest/stable value (toolbar-visible state) and never changes
     mid-gesture, so the pin math stays correct throughout. Matched
     with .scroll-spacer's height below — they need to agree with each
     other, which they do; using the STABLE unit for both instead of
     the dynamic one is what actually fixes this, not which specific
     unit they happen to share. */
  height: 100svh;
  overflow: hidden;
  cursor: pointer; /* hints the whole screen is clickable, matching "Open the invitation" */
}

/* Sky/parchment backdrop behind the envelope — the envelope's own
   background is genuinely transparent now (chroma-keyed out of the
   original photo's black backdrop), so this shows through wherever
   `cover` sizing doesn't have envelope pixels to show (i.e. barely
   anywhere, but it's there for any edge case). */
.backdrop {
  position: absolute;
  inset: 0;
  /* Was a sky-to-parchment gradient — but this is specifically what
     shows through around/behind the envelope (its own gaps on desktop
     `cover`, and the letterboxed edges on mobile `contain`), so a flat
     match to the envelope's own paper color reads as one continuous
     surface instead of the envelope visibly sitting on top of a
     different-colored page. */
  background: var(--envelope-cream);
}

/* ---- SKY SCENE — revealed on click ----
   Sits behind the envelope in the DOM (so it stacks underneath with no
   z-index needed) and starts fully transparent. A click fades the
   envelope out and this in together, revealing open sky with birds.
   Same gradient tokens and bird line-art as the finished villa.html
   site, for visual continuity between the two pieces. */
.sky-scene {
  position: absolute;
  inset: 0;
  opacity: 0;
}
.sky-scene .sky-bg {
  position: absolute;
  inset: 0;
  background: linear-gradient(to bottom, var(--sky) 0%, var(--parchment) 65%);
}

/* Couple photo, now living behind the monogram/"Save the date" text
   instead of a separate flat section — this is the "blend" the sky-bg
   gradient alone couldn't give. Sits on top of .sky-bg (covers it
   entirely with `cover` sizing, so the gradient is just a fallback for
   any edge the photo doesn't reach) and underneath the scrim + text,
   per DOM order. */
.sky-scene .sky-photo {
  position: absolute;
  /* top:-100px (not inset:0's top:0) is the actual fix for the hard top
     edge — the box now starts 100px above the container, well past the
     70px it ever gets shifted down by the translateY animation below.
     So at every point in that animation, its rendered top edge stays at
     or above y=0: -100+70=-30px at the very start, -100+0=-100px at
     rest. It never dips below 0, which means it never opens a gap that
     exposes .sky-bg's flat blue underneath — that exposed-gap, not the
     photo's own edge, was the actual hard line (masking the photo's own
     top, tried earlier, did nothing because the photo's box — mask
     included — was sliding down as a whole, gap and all, along with it).
     (70px, up from 20px, so it starts noticeably lower/further down
     before rising in — the overextension above had to grow to match, to
     keep the same never-reveals-a-gap guarantee.) .stage's
     overflow:hidden clips the overextension itself, so nothing spills
     past the visible screen. */
  top: -100px;
  left: 0;
  right: 0;
  bottom: 0;
  background-image: url('couple-2.webp');
  background-repeat: no-repeat;
  background-size: cover;
  /* Was "center 30%" — the couple isn't actually centered in the photo
     itself (Vilma sits left-of-center, Edgar further right, roughly
     around the 57% mark across the image), so on narrow/mobile crop
     windows (much narrower than the full photo under `cover`), a
     geometric 50% center crops disproportionately into Edgar's side.
     57% biases the crop window to actually center on the two of them
     together, not the photo's raw midpoint. */
  background-position: 57% 30%;
  /* Starts hidden even once .sky-scene itself is fully visible after the
     click — this and .sky-scrim fade in together on scroll (see the
     ScrollTrigger below), not immediately on click. Opacity here
     compounds with .sky-scene's own opacity, so it stays invisible
     until both are true. Also starts nudged down slightly, rising into
     place as it fades — a small "coming from below" touch rather than
     just a flat crossfade. */
  opacity: 0;
  transform: translateY(70px);
  /* Dissolve-wipe for the exit (see the JS timeline): --wipe is a plain
     percentage GSAP animates directly. The mask is fully opaque (black)
     everywhere until --wipe rises above 0, at which point the region
     from the RIGHT edge up to --wipe becomes transparent — "to left"
     means the gradient's 0% stop sits at the right edge, 100% at the
     left, so growing --wipe erases right-to-left. The ~20-point gap
     between the two transparent/black stops is the feather: a soft,
     gradual dissolve rather than a hard-edged wipe, reading as falling
     apart rather than sliding away. (Used to also grow a blur filter in
     the same tween for extra softness — dropped it, animated blur on a
     large photo was expensive enough to cause visible frame drops.) */
  --wipe: 0%;
  -webkit-mask-image: linear-gradient(to left, transparent 0%, transparent var(--wipe), black calc(var(--wipe) + 22%), black 100%);
  mask-image: linear-gradient(to left, transparent 0%, transparent var(--wipe), black calc(var(--wipe) + 22%), black 100%);
  /* Hints the browser to promote this to its own compositing layer
     ahead of time, rather than discovering mid-scroll that it needs
     to. */
  will-change: transform, opacity;
}

/* Parchment-tinted wash over the photo so the ink-colored monogram and
   "Save the date" text stay legible against a busy image — heavier
   behind the monogram/tagline near the top, easing off through the
   middle so the photo still reads as a photo, not just a texture. */
.sky-scene .sky-scrim {
  position: absolute;
  /* Same overextended top as .sky-photo (now -100px, matching its 70px
     rise), same reason — keeps this from opening its own gap above the
     photo while it's rising into place. */
  top: -100px;
  left: 0;
  right: 0;
  bottom: 0;
  background: linear-gradient(
    to bottom,
    rgba(247, 241, 228, 0.78) 0%,
    rgba(247, 241, 228, 0.5) 32%,
    rgba(247, 241, 228, 0.38) 60%,
    rgba(247, 241, 228, 0.62) 100%
  );
  /* Fades in together with .sky-photo — no scrim needed while there's no
     photo underneath it yet. Same rise (70px, up from 20px, so it starts
     further down the screen), so the two move as one rather than the
     scrim staying static while the photo shifts under it. Same
     dissolve-wipe treatment as .sky-photo, in sync, so the scrim doesn't
     linger as a flat rectangle after the photo underneath it has already
     dissolved away. */
  opacity: 0;
  transform: translateY(70px);
  --wipe: 0%;
  -webkit-mask-image: linear-gradient(to left, transparent 0%, transparent var(--wipe), black calc(var(--wipe) + 22%), black 100%);
  mask-image: linear-gradient(to left, transparent 0%, transparent var(--wipe), black calc(var(--wipe) + 22%), black 100%);
  will-change: transform, opacity;
}

/* Pure scroll room — no content of its own. Gives the (sticky-pinned)
   .stage something to scroll against so everything below has a scroll
   distance to animate across: couple fade-in, a hold, couple-exits/
   villa-enters together, villa's continued push-in, then the caption.
   All of it now lives inside the ONE .stage/.scroll-spacer pair — the
   couple photo and villa used to be two separate pinned scenes handed
   off sequentially, but that meant they could never be on screen at
   the same time, which is what "villa starts appearing as the couple
   starts exiting" actually requires. Taller than the single-beat
   100dvh it used to be (this now covers five choreographed beats
   instead of one), so .stage stays pinned that much longer too. */
.scroll-spacer {
  /* Must match .stage's unit — was dvh/dvh (matched to each other,
     avoiding a start-point misalignment at page load), now svh/svh
     for the same reason plus one more: dvh tracks the phone toolbar
     LIVE, but GSAP's ScrollTrigger caches its pin/scroll boundary math
     once at setup using whatever dvh was at that moment. If the
     toolbar collapses mid-scroll (real phone-browser behavior; iPad
     barely does this), dvh grows out from under the cached
     boundaries, and the pin needs more actual scroll distance to
     finish than GSAP thinks it does — reported as "extra scroll after
     the villa's already settled," specifically on phone. svh is the
     stable/minimum value and doesn't move mid-gesture, so the cached
     math stays correct for the whole scroll. Keeping both this and
     .stage on the same unit is still what matters for the original
     alignment concern — svh for both preserves that agreement, dvh
     for both is what had the toolbar-drift problem. */
  /* Was 210dvh, sized for a timeline that ran all the way to 6.8 —
     shrunk to 170dvh (now 170svh) once the zoom/text tweens end at 5.5
     instead, so the scroll distance still maps 1:1 onto the shortened
     timeline rather than leaving a stretch of "dead" scroll at the
     end where nothing was still animating. */
  height: 170svh;
}

/* ---- VILLA — now a layer inside .stage, not its own scene ----
   villa-cutout.webp: same transparent cutout villa.html uses. Used to
   be a full inset:0 box filling the whole stage; now a much smaller,
   deliberately sized box (42vw, capped at 380px, square to match the
   source image's actual 1024x1024 dimensions) anchored near the right
   edge (right: 6vw) instead — "smaller" and "final spot on the right"
   are really the same change: the box's resting size/position IS its
   final spot, everything else is just animated relative to that. No
   backdrop of its own — .stage's own background shows through
   (parchment, since .backdrop is the envelope-cream color and .sky-bg's
   gradient has long since faded to parchment by the time this is
   visible), rather than the sky-to-parchment gradient used earlier in
   the scene. */
.villa-image {
  position: absolute;
  /* Was 50% — with the zoom now reaching scale 1.4 (up from 1.12), the
     enlarged villa was growing down far enough to overlap
     .villa-caption sitting at bottom:14vh. Moved up to give it
     clearance. */
  top: 42%;
  right: 6vw;
  /* Was 42vw/380px, then 48vw/430px — bumped up more this time. */
  width: 60vw;
  max-width: 540px;
  aspect-ratio: 1 / 1;
  background-image: url('villa-cutout.webp');
  background-repeat: no-repeat;
  background-size: contain;
  background-position: center center;
  filter: drop-shadow(0 18px 34px rgba(30, 20, 10, 0.22));
  transform-origin: 50% 60%;
  /* translateY(-50%) is baseline vertical centering (top:50% + this).
     translateX(150%) starts it well off-screen to the right of its own
     resting spot (right: 6vw) — the slide-in tween below animates x
     down to 0, which is what actually lands it at that resting
     position. GSAP tracks translateX/Y as independent components, so
     animating x alone doesn't disturb the y centering. */
  transform: translateY(-50%) translateX(150%);
  will-change: transform;
}
.villa-caption {
  position: absolute;
  left: 0;
  right: 0;
  bottom: 14vh;
  text-align: center;
  font-family: 'EB Garamond', serif;
  font-weight: 600;
  /* Was clamp(1rem, 2.6vw, 1.35rem) — bumped up. */
  font-size: clamp(1.3rem, 3.4vw, 1.8rem);
  text-transform: uppercase;
  letter-spacing: 0.4em;
  color: var(--ink);
  opacity: 0;
  padding-left: 0.4em;
}

/* A small "scroll for more" cue at the bottom of the sky scene, fading
   in with everything else — scrolling is what fades the couple photo in
   behind the monogram/text, so this hints that there's more to see. */
.scroll-hint {
  position: absolute;
  left: 0;
  right: 0;
  bottom: 6vh;
  text-align: center;
  font-family: 'EB Garamond', serif;
  font-style: italic;
  font-size: clamp(0.83rem, 1.85vw, 0.98rem);
  text-transform: uppercase;
  letter-spacing: 0.3em;
  color: var(--ink);
  opacity: 0.55;
}

.bird {
  position: absolute;
  width: 26px;
  height: auto;
  opacity: 0;
  pointer-events: none;
}
.bird svg { width: 100%; height: 100%; display: block; }
.bird-a { top: 18%; animation: flyA 19s linear infinite; animation-delay: 0.5s; }
.bird-b { top: 26%; width: 19px; animation: flyB 23s linear infinite; animation-delay: 4s; }
.bird-c { top: 12%; width: 16px; animation: flyA 27s linear infinite; animation-delay: 8s; }
@keyframes flyA {
  0%   { left: -5%;  opacity: 0; }
  5%   { opacity: 0.6; }
  95%  { opacity: 0.6; }
  100% { left: 106%; opacity: 0; }
}
@keyframes flyB {
  0%   { left: 110%; opacity: 0; }
  5%   { opacity: 0.42; }
  95%  { opacity: 0.42; }
  100% { left: -6%;  opacity: 0; }
}

/* ---- MONOGRAM — the sky scene's centerpiece ----
   E and V as two large serif letters, deliberately overlapping rather
   than sitting side by side — the classic engraved-crest look, like the
   wax seal on the envelope but scaled up into the focal element of this
   scene. V sits in front (higher in the DOM = on top with no z-index
   needed) so its shape naturally cuts across E where they intersect,
   the way two overlapping letters actually look engraved/pressed
   together rather than just stacked. */
.monogram {
  position: absolute;
  left: 50%;
  top: 10%;
  transform: translate(-50%, -50%);
  width: clamp(95px, 18vw, 160px);
  aspect-ratio: 1 / 1;
  pointer-events: none;
}
.monogram .mono-letter {
  position: absolute;
  top: 50%;
  /* Cinzel: geometric, evenly-weighted Roman capitals — the classic
     engraved/wax-seal monogram look, distinct on purpose from the
     Cormorant Garamond used everywhere else on this page; monograms
     traditionally get their own dedicated display face. */
  font-family: 'Cinzel', serif;
  line-height: 1;
  font-size: clamp(2.6rem, 8vw, 4.8rem);
  /* Same ink color as the rest of the text now, for consistency —
     was gold. */
  color: var(--ink);
}
.mono-e {
  left: 42%;
  transform: translate(-50%, -50%);
}
.mono-v {
  left: 58%;
  /* Same top as E (50%, inherited) — the drop comes from the extra
     translateY below, sized off the letter's own font-size rather than
     the small monogram box's percentage height, so it scales correctly
     at any screen size. Was 0.5em, then 0.35em, eased back once more. */
  transform: translate(-50%, -50%) translateY(0.22em);
}

/* ---- SAVE-THE-DATE BLOCK — below the monogram, same scene ----
   Matches the font/spacing pattern from the reference: a loose cursive
   tagline, then a tracked-out serif caps date, then bigger tracked-out
   serif caps names. No separate reveal animation — rides along with
   .sky-scene's own opacity fade, same as the monogram and birds. */
.save-block {
  position: absolute;
  left: 0;
  right: 0;
  top: 36%;
  text-align: center;
  will-change: transform;
  /* Desktop (>1024px) shift values. Narrow-portrait and phone-landscape
     overrides live in the matching media-query blocks below.
     GSAP tweens --shift-px and --shift-py from 0→1 (unitless drivers);
     the actual distances are supplied here by --shift-x / --shift-y
     and multiplied in via calc(). This lets CSS media queries re-evaluate
     the distances live on rotation without any JS invalidation. */
  --shift-x: -22vw;
  --shift-y: 0vh;
  transform: translate(calc(var(--shift-x) * var(--shift-px)),
                       calc(var(--shift-y) * var(--shift-py)));
}

/* Small tracked-caps line above the cursive tagline. Originally
   copied .from-eyebrow's exact styling wholesale (italic, 0.34em
   spacing, full opacity) since it's the same "small eyebrow above
   bigger text" role — but .from-eyebrow's actual visual partner is
   .from-names on a different screen entirely; THIS eyebrow's partner,
   the thing it's actually seen next to, is .save-date right below the
   tagline. Matched to that instead: same letter-spacing (was 0.34em,
   .save-date uses 0.38em — visibly different tracking on two lines
   framing the same headline reads as unintentional), dropped the
   italic (.save-date isn't italic), same opacity:0.8 (.save-date
   dims itself slightly; eyebrow was sitting at full ink-black next to
   it), and the same padding-left centering nudge .save-date uses to
   counteract letter-spacing pushing the line off-center. Smaller
   font-size than .save-date is unchanged/intentional — the mismatch
   was in spacing/weight/opacity, not scale. margin-bottom went
   0.8em (~10px, read as no gap at all against a 60px+-tall cursive
   headline) -> 2.6em (~34px, matching .from-eyebrow's own value
   above .from-names) -> 4em (~52px) per direct feedback that 2.6em
   still wasn't enough. Checked there's room for it — no collision
   with the monogram above or .save-date/.villa-caption below at
   375px. */
.save-eyebrow {
  font-family: 'EB Garamond', serif;
  font-weight: 500;
  /* Sizing history: own smaller clamp -> matched .save-date exactly
     (too big, reverted) -> smaller again ("is smaller which is
     fine") -> briefly made bigger than .save-date based on a
     misreading of a reference image's size guide — corrected once the
     actual reference was confirmed to show eyebrow SMALLER than date,
     matching what was already live -> nudged up ~10% (0.82/2.05/1.05
     -> 0.9/2.2/1.15) per "slightly bigger" feedback. Checked this
     doesn't cross over .save-date's own size anywhere in between —
     the two clamp() curves don't scale at the same rate, so a small
     bump can still flip which one's bigger at some in-between width
     even if it looks fine at the floor and cap. Swept both formulas
     across 300-2000px: closest point is ~710px (tablet range) where
     .save-date is still ~0.7px bigger — holds, just not by much. */
  font-size: clamp(0.9rem, 2.2vw, 1.15rem);
  text-transform: uppercase;
  letter-spacing: 0.38em;
  color: var(--ink);
  opacity: 0.8;
  padding-left: 0.38em;
  /* Fixed rem, not em: was 4em, which is relative to THIS element's
     own font-size. .save-tagline's matching margin-bottom below is
     also now a fixed rem (was 0.5em, relative to ITS much bigger
     font-size) — both had to move off em and onto a shared fixed unit
     for the gap above and below the tagline to actually stay equal,
     since eyebrow/date and tagline scale on very different clamp()
     curves; two em-based margins on different-sized elements can
     match at one viewport width and diverge at another. 3.3rem here
     matches .save-tagline's margin-bottom exactly (~52.8px) — same
     target the earlier 4em landed on at 375px, just now guaranteed
     equal at every width instead of only that one. */
  margin-bottom: 3.3rem;
}

.save-tagline {
  font-family: 'Mrs Saint Delafield', cursive;
  /* Was clamp(4.4rem, 14vw, 7.4rem) — both numbers measured wrong for
     two different reasons, found by actually rendering the text and
     measuring it (Range.getBoundingClientRect), not eyeballing it:
     (1) the 4.4rem FLOOR was tuned against "Save The Date" on phone,
     but "Reserva La Fecha" renders ~18% wider in this cursive font at
     the same size — at 4.4rem/375px wide it measured 374.5px wide,
     essentially touching both edges (0.47px to spare). 3.8rem gives
     it real margin (~26px/side at 375px) without the English version
     getting noticeably smaller. (2) the 14vw coefficient hit its own
     7.4rem CAP at only ~846px width — meaning an iPad (744-1024px
     portrait) was getting nearly full desktop-max text size with far
     less width to fit it in than an actual desktop window has. 9vw
     doesn't reach the cap until ~1315px, so tablets scale down
     properly with their actual available width instead of ballooning
     toward the same ceiling desktop uses. */
  font-size: clamp(3.8rem, 9vw, 7.4rem);
  line-height: 1;
  color: var(--ink);
  /* Fixed rem (was 0.5em) — see .save-eyebrow's margin-bottom comment
     above for why: this needs to equal that value in absolute terms,
     not just in the em-of-a-different-font-size sense that happened
     to line up at one specific viewport width. */
  margin-bottom: 3.3rem;
  /* iPhone-specific: reported flickering "as it enters or exits" —
     matches a known iOS Safari bug class where large text inside a
     position:sticky section that ALSO gets its own transform tween
     (see .save-block's GSAP --shift-px/--shift-py driver tweens in
     the scroll timeline below, which CSS calc()s into a transform)
     loses stable GPU-layer compositing right at the pin's entry/exit
     boundaries, causing a visible repaint flicker. .from-names uses
     the identical cursive font but isn't scroll-transform-driven at
     all (it's plain intro-screen content) and wasn't reported as
     flickering — this is the concrete difference between the two.
     Forces this element onto its own stable compositing layer, the
     standard fix for that bug class. Can't verify this on a real
     iPhone myself (no device access, and this browser's engine won't
     reproduce a WebKit-specific compositing bug) — flag if it's still
     happening after this. */
  transform: translateZ(0);
  -webkit-backface-visibility: hidden;
  backface-visibility: hidden;
}

.save-date {
  font-family: 'EB Garamond', serif;
  font-weight: 500;
  /* Was clamp(1.1rem, 2.8vw, 1.5rem), then clamp(1.4rem, 3.6vw,
     1.95rem), then clamp(1.4rem, 2.3vw, 1.95rem) fixing the
     coefficient's too-early cap. The 1.4rem FLOOR turned out to still
     be broken, just invisibly: Range.getBoundingClientRect() on a
     wrapped Range returns the union bbox of ALL its lines, which can
     look like "one narrower box" instead of revealing there were two
     — that's exactly what happened at 1.4rem: the earlier "317px/
     282px, comfortable margin" check was actually measuring a WRAPPED
     first line, not the true single-line width. Checked properly this
     time with white-space:nowrap to get the real width before
     re-enabling wrap and confirming getClientRects().length===1: at
     1.4rem the real unwrapped width was 373.4px on a 375px screen —
     0.8px to spare, which is why it was actually wrapping to 2 lines
     in practice. 1rem leaves ~54px/side margin and stays single-line,
     confirmed both languages. Briefly shrunk below .save-eyebrow's
     size (reusing its old range) based on a misread reference image —
     reverted back to this once the actual reference was confirmed to
     show the date BIGGER than the eyebrow, same as before. */
  font-size: clamp(1rem, 2.3vw, 1.95rem);
  text-transform: uppercase;
  letter-spacing: 0.38em;
  color: var(--ink);
  opacity: 0.8;
  /* nudge right to visually re-center against the letter-spacing,
     which otherwise pushes the whole line slightly left */
  padding-left: 0.38em;
}

/* Full-bleed envelope, filling the entire screen edge-to-edge.
   cover (not contain) per "make it fit the whole screen" — this crops
   rather than letterboxes. This version of envelope.jpeg already has a
   soft cream backdrop (no chroma-key needed like the first version did),
   which reads as a continuation of the page's own parchment tone rather
   than a hard edge. background-position biased slightly above center
   keeps the wax seal and scalloped flap comfortably in frame even when
   a narrow phone screen crops the sides more aggressively than a wide
   desktop window would. */
.envelope-photo {
  position: absolute;
  inset: 0;
  background-image: url('envelope.jpeg');
  background-repeat: no-repeat;
  background-size: cover;
  background-position: center 42%;
  opacity: 0;
  transform: scale(1.02);
}

/* ---- OLIVER — a one-time run across the envelope screen ----
   oliver-sprite.png: 8 hand-drawn frames in one horizontal strip,
   chroma-keyed transparent, no ground line. Two animations run
   together: oliverRunAcross moves the whole element left-to-right
   once; oliverRunCycle steps through the 8 frames on a loop the whole
   time it's crossing, via background-position stepping
   (background-size:800% = 8 frames wide, each step call moves exactly
   one frame-width). aspect-ratio keeps it proportional at any screen
   width instead of a fixed pixel size. */
.oliver-run {
  position: absolute;
  bottom: 0;
  width: clamp(100px, 24vw, 160px);
  aspect-ratio: 385 / 220;
  background-image: url('oliver-sprite.png');
  background-repeat: no-repeat;
  background-size: 800% 100%;
  /* Art faces left; he moves left-to-right, so mirror him to face the
     direction he's traveling (otherwise he visually runs backwards). */
  transform: scaleX(-1);
  opacity: 0;
  pointer-events: none;
  /* .open-line/.from-block carry z-index:2; .duque-rest has z-index:auto.
     z-index:1 places Oliver above the resting Duque while keeping both
     below the text. Avoiding z-index:2 here is intentional — that would
     tie with .open-line and DOM order would resolve the tie anyway, but
     ties are fragile and unclear. This has no visual effect at desktop,
     portrait, or iPad where the sprites never overlap; it only changes
     the paint order in phone landscape where Duque's lane and Oliver's
     run lane intersect. */
  z-index: 1;
  /* The two animations are intentionally independent: oliverRunCycle
     is his leg/gait pace (how fast he's running in place) and stays
     fixed regardless of crossing speed — only oliverRunAcross's
     duration controls how much screen distance he covers per second.
     Movement is linear (constant speed, no easing) so that
     distance/sec stays constant across the whole crossing rather than
     accelerating/decelerating at the ends. oliverRunCycle loops
     `infinite` rather than a fixed count so it isn't tied to
     oliverRunAcross's duration — change one without needing to
     recompute the other. 1s delay on BOTH — he's chasing the ball
     (see .ball-run below), which starts at 0s with a slightly faster
     speed, so this delay is what keeps him a beat behind for the
     whole crossing rather than catching up. Duration covers his
     LONGER path (-28vw to 108vw = 136vw, not 108vw like the ball —
     see the keyframes below) at roughly the same speed as the ball,
     not just the same duration. */
  animation:
    oliverRunAcross 4.9s 1s linear forwards,
    oliverRunCycle 1s 1s steps(7) infinite;
}
@keyframes oliverRunAcross {
  /* Starts off-screen at -28vw (not the left edge) so he visibly runs
     IN from off-screen — was 0vw for a while, to fix an unrelated
     timing bug where he stayed invisible too long relative to text
     that no longer applies now that the ball, not text, is what he's
     timed against. The ball has no such runway (it starts already on
     -screen at 0vw), so only Oliver gets one here. */
  0%   { left: -28vw; opacity: 1; }
  100% { left: 108vw; opacity: 1; }
}
@keyframes oliverRunCycle {
  from { background-position: 0% 0; }
  to   { background-position: 100% 0; }
}

/* ---- BALL — Oliver's chase target, same path/speed, no head start ----
   ball-sprite.png: 8 frames, but unlike oliver-sprite.png/duque-
   sprite.png (each frame cropped to an IDENTICAL window so a looping
   gait reads as in-place motion), these frames were intentionally
   cropped to preserve each frame's own vertical position from the
   source gif — the ball is falling/bouncing within the frame, not
   running in place. So background-position stepping through them
   plays out an actual bounce arc, not a stabilized loop. Combined
   with ballRunAcross (identical path/speed to oliverRunAcross, just
   with no delay so it leads) this reads as the ball bouncing while
   rolling across the screen, with Oliver chasing a beat behind. */
.ball-run {
  position: absolute;
  bottom: 0;
  /* Was clamp(28px,6.5vw,50px) — a tennis ball next to a dog is small,
     roughly an eighth of his body length in real life; the old size
     read as a beach ball. This targets ~14% of Oliver's own width
     clamp (100-160px) instead of an unrelated fixed size. */
  width: clamp(14px, 3.2vw, 22px);
  aspect-ratio: 50 / 223;
  background-image: url('ball-sprite.png');
  background-repeat: no-repeat;
  background-size: 800% 100%;
  opacity: 0;
  pointer-events: none;
  /* z-index:1 matches .oliver-run — same reasoning: above .duque-rest
     (auto) but below text at z-index:2. See .oliver-run comment above. */
  z-index: 1;
  /* No delay on either animation — the ball starts moving and
     bouncing the instant the page loads, unlike Oliver (1s delay,
     see .oliver-run). */
  animation:
    ballRunAcross 4.53s linear forwards,
    /* alternate (not infinite-forward-only): the 8 frames trace ONE
       downward bounce, not a circular loop — playing forward then
       backward through them gives a smooth down/up bounce instead of
       snapping from frame 8 back to frame 0 every cycle. */
    ballBounce 0.6s steps(7) infinite alternate;
}
@keyframes ballRunAcross {
  /* Starts off-screen at -28vw, matching Oliver's own entrance point
     (was 0vw — already on-screen at load). Duration recalculated to
     hold the same ~30vw/s speed over the now-longer 136vw path
     (-28vw to 108vw, was 108vw) rather than just keeping the old 3.6s
     and quietly changing his actual speed. */
  0%   { left: -28vw; opacity: 1; }
  100% { left: 108vw; opacity: 1; }
}
@keyframes ballBounce {
  from { background-position: 0% 0; }
  to   { background-position: 100% 0; }
}

/* ---- DUQUE — lying down on top of the word "invitation" ----
   duque-sprite.png: 7 frames of the same resting pose (near-identical
   bounding box in the source gif — just a subtle idle wiggle, no run
   cycle). No left/right movement — just the idle frame-cycle. Was
   originally bottom:0 on the same row Oliver/the ball run across,
   which meant their sprite boxes visibly crossed through him mid-
   chase; moved up here instead. In portrait this puts him off that lane
   entirely (bottom:18vh = ~146px at 812px screen height, well clear of
   Oliver's ~57px run lane). In phone landscape the viewport compresses
   and the landscape block overrides his bottom to 9dvh (was) / 17dvh
   (now) — see the phone-landscape block for the separation fix. Positioned
   like he's resting on the last word of .open-line ("...invitation").
   `left` is a measured (not guessed) center-alignment: got the actual
   rendered bounding box of the word "invitation" in .open-line via
   Range.getBoundingClientRect(), at both this breakpoint's reference
   width and the mobile override's below — .open-line's letter-spacing
   differs between the two (0.42em vs 0.3em), so the word lands at a
   different vw position at each, not just a scaled version of the
   other. `bottom` was originally set to match .open-line's own bottom
   exactly (his body sitting right at the text's baseline), but that
   put him low enough to actually cover the letters — raised by ~4vh
   so there's clear space between him and the text instead of resting
   on it. Left unmirrored (his natural facing direction) since he's
   decorative here, not oriented toward anything in particular. */
.duque-rest {
  position: absolute;
  bottom: 18vh;
  left: calc(58.5vw - 70px);
  width: clamp(90px, 20vw, 140px);
  aspect-ratio: 379 / 220;
  background-image: url('duque-sprite.png');
  background-repeat: no-repeat;
  background-size: 700% 100%;
  opacity: 0;
  pointer-events: none;
  /* Unlike Oliver/the ball, Duque's opacity is GSAP-controlled, not a
     CSS keyframe — see introTl below, where he fades in alongside
     .open-line at the same 0.7s/0.9s timing. Tried a pure-CSS
     `duqueFadeIn` animation with `forwards` fill first, matching
     Oliver/the ball's independence from GSAP, but a CSS animation
     holding a property via `forwards` keeps overriding it even after
     the animation finishes — which silently broke his fade-OUT on
     click (GSAP's inline opacity:0 was getting overridden right back
     to 1 by the still-active `forwards` fill). Since he needs both a
     GSAP-driven fade-out on click AND a synced fade-in, opacity has to
     live entirely in GSAP; only the idle background-position loop
     below stays pure CSS (harmless — GSAP never touches that
     property). */
  animation: duqueIdle 2.5s steps(6) infinite;
}
@keyframes duqueIdle {
  from { background-position: 0% 0; }
  to   { background-position: 100% 0; }
}

/* ---- "Open the invitation" — bottom of the screen ---- */
.open-line {
  position: absolute;
  left: 0;
  right: 0;
  /* Was 8vh — raised so it clears Oliver now that he runs flush along
     the very bottom of the screen (bottom:0) instead of floating at
     20vh; his sprite box can be up to ~91px tall at its widest clamp,
     which ate into the old 8vh gap. */
  bottom: 15vh;
  text-align: center;
  font-family: 'EB Garamond', serif;
  font-style: italic;
  font-weight: 600;
  font-size: clamp(0.85rem, 2.2vw, 1.15rem);
  text-transform: uppercase;
  letter-spacing: 0.42em;
  color: var(--ink);
  opacity: 0;
  z-index: 2;
}

/* ---- "A Love letter from / Edgar & Vilma" — top of the screen ---- */
.from-block {
  position: absolute;
  left: 0;
  right: 0;
  top: 12vh;
  text-align: center;
  z-index: 2;
}

.from-eyebrow {
  font-family: 'EB Garamond', serif;
  font-style: italic;
  font-weight: 500;
  font-size: clamp(0.82rem, 2.05vw, 1.05rem);
  text-transform: uppercase;
  letter-spacing: 0.34em;
  color: var(--ink);
  /* More separation from the names below — was 0.35em, then 1.1em, then 2em. */
  margin-bottom: 2.6em;
  opacity: 0;
}

.from-names {
  /* Same font as "Save the date" in the sky scene, for consistency
     between the two cursive moments on the page. */
  font-family: 'Mrs Saint Delafield', cursive;
  font-size: clamp(3.2rem, 9vw, 5.2rem);
  line-height: 1;
  color: var(--ink);
  margin-top: 0.9em;
  /* No opacity/transition here anymore — each .letter span inside
     handles its own reveal now (see the per-letter stagger below), so
     the container itself just needs to be visible from the start. */
}

/* Each character of "Edgar & Vilma" is its own inline-block span so
   GSAP can stagger them in one at a time, like the name being written
   one letter at a time. */
.from-names .letter {
  display: inline-block;
  opacity: 0;
}

/* ---- CLOSING SECTION — normal document flow, after .scroll-spacer ----
   Not sticky-pinned like .stage — it doesn't need its own scroll
   choreography, it just sits in normal flow and appears naturally as
   .stage scrolls away above it once .scroll-spacer's range is used up
   (same mechanic that already hands off couple-photo to villa). Simple
   fade+rise on scroll-into-view (see the script), not the elaborate
   scrubbed timeline the scenes above use — this is a closing beat, not
   another whole scene. */
.closing-section {
  /* Was min-height:90vh + justify-content:center — centering content
     inside a tall box leaves a large empty area ABOVE it (roughly half
     the box's height), which is what was reading as "a big gap" right
     after .stage scrolls away. Shorter box, content anchored toward the
     top with a modest fixed padding instead of centered — content now
     starts close to where .stage hands off, not floating in the middle
     of a mostly-empty section. */
  min-height: 55vh;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: flex-start;
  gap: clamp(2rem, 6vw, 3.5rem);
  /* Bottom padding adds the home-indicator inset on top of its own 4rem
     so the countdown never sits under it. env() only returns real values
     now that the viewport meta carries viewport-fit=cover; before that it
     resolved to 0 everywhere, which is why the two env() calls on
     .lang-toggle below were silently falling back to their 16px floors.
     Note this handles the PHYSICAL home indicator only - Safari's
     retracting toolbar is not an inset and is not reported by env();
     that is what the svh/lvh choice above deals with. */
  padding: 3rem 1.5rem calc(4rem + env(safe-area-inset-bottom, 0px));
  text-align: center;
  background: var(--parchment);
  opacity: 0;
  transform: translateY(30px);
}

.invitation-note {
  font-family: 'EB Garamond', serif;
  font-style: italic;
  font-weight: 600;
  /* Was clamp(0.9rem, 2.2vw, 1.15rem) — actually wrapping to 2 lines
     at 375px (getClientRects().length===2), found the same way as
     .save-date's identical bug: a bounding-box width check alone
     doesn't reveal wrapping, since a wrapped Range's union bbox can
     still look like a single reasonably-sized box. The longer Spanish
     text ("La invitación formal llegará pronto") was the tighter
     case. Dropped to 0.55rem to fix the wrap, checked against a
     375px viewport — wrong constraint: this element lives inside
     .closing-section, which has 24px of padding each side, so the
     real available width is ~327px, not 375px. That's why a later
     bump to 0.625rem still wrapped even though it looked safe against
     the viewport. Fixed properly this time by measuring against the
     actual container (327px minus this element's own padding-left):
     font-size alone had almost no room left to grow (0.55->~0.56rem
     was the entire safe range), so also brought letter-spacing down
     from 0.42em to 0.2em — freed up enough width to reach 0.6875rem
     (11px, up from 8.8px) with real margin (~20px) instead of being
     stuck a fraction of a pixel above where it started. */
  font-size: clamp(0.6875rem, 2.2vw, 1.15rem);
  text-transform: uppercase;
  letter-spacing: 0.2em;
  color: var(--ink);
  /* nudge right to visually re-center against the letter-spacing —
     kept matched to the new 0.2em (was 0.42em to match the old
     tracking; the whole point of this compensation is to track
     whatever letter-spacing actually is). */
  padding-left: 0.2em;
}

.calendar-block {
  display: flex;
  flex-direction: column;
  align-items: center;
}

.calendar-btn {
  display: inline-block;
  font-family: 'EB Garamond', serif;
  font-weight: 600;
  font-size: clamp(0.85rem, 2vw, 1rem);
  text-transform: uppercase;
  letter-spacing: 0.28em;
  color: var(--ink);
  text-decoration: none;
  border: 1px solid var(--ink);
  padding: 0.9em 2.2em;
  border-radius: 2px;
  /* Re-centers the label against its own letter-spacing, same idea as
     .save-date's padding-left trick. */
  padding-left: 2.48em;
  transition: background 0.25s ease, color 0.25s ease;
}
.calendar-btn:hover {
  background: var(--ink);
  color: var(--parchment);
}

.calendar-alt {
  display: inline-block;
  margin-top: 1.1em;
  font-family: 'EB Garamond', serif;
  font-style: italic;
  font-size: clamp(0.86rem, 1.85vw, 0.98rem);
  color: var(--ink);
  opacity: 0.65;
}

/* Fixed position (not absolute within .stage) so it stays put through
   the ENTIRE page, including .closing-section which sits outside
   .stage entirely. Small and low-contrast on purpose — a visible but
   quiet escape hatch, not a prominent control, since auto-detection
   should get it right for most visitors already. */
.lang-toggle {
  position: fixed;
  top: max(16px, env(safe-area-inset-top));
  right: max(16px, env(safe-area-inset-right));
  z-index: 50;
  background: rgba(247, 241, 228, 0.82);
  border: 1px solid var(--ink);
  color: var(--ink);
  font-family: 'EB Garamond', serif;
  font-weight: 600;
  font-size: 0.72rem;
  letter-spacing: 0.15em;
  text-transform: uppercase;
  padding: 0.5em 0.85em;
  border-radius: 999px;
  cursor: pointer;
}

.countdown {
  display: flex;
  justify-content: center;
  gap: clamp(1.1rem, 4vw, 2.6rem);
}
.countdown-unit {
  display: flex;
  flex-direction: column;
  align-items: center;
  min-width: 3.2em;
}
.countdown-num {
  font-family: 'Cormorant Garamond', serif;
  font-weight: 600;
  font-size: clamp(2rem, 6vw, 3.2rem);
  color: var(--ink);
  line-height: 1;
  /* Locks digit width so the countdown doesn't visibly jitter/reflow
     every second as digit widths change (e.g. "1" vs "8"). */
  font-variant-numeric: tabular-nums;
}
.countdown-label {
  font-family: 'EB Garamond', serif;
  font-size: clamp(0.65rem, 1.4vw, 0.78rem);
  text-transform: uppercase;
  letter-spacing: 0.25em;
  color: var(--ink);
  opacity: 0.65;
  margin-top: 0.6em;
  padding-left: 0.25em;
}

/* ---- MOBILE ---- */
@media (max-width: 480px) {
  /* Was bottom:6vh — on mobile, .envelope-photo switches to
     background-size:contain (see below), which no longer fills the
     screen edge-to-edge, so the envelope's actual bottom edge sits well
     above the screen's bottom edge. 20dvh roughly splits the difference
     between the two instead of pinning tight to the bottom, which used
     to leave a big empty gap above the text and cram it too close to
     the edge. dvh (not vh), matching .stage, so this doesn't drift on
     phones where the address bar changes the viewport height. */
  .open-line  { bottom: 20dvh; letter-spacing: 0.3em; }
  /* Re-measured for this breakpoint specifically — .open-line's
     letter-spacing drops to 0.3em here (vs 0.42em above), which
     shifts where "invitation" actually lands; same
     measure-don't-guess approach as the base rule. */
  .duque-rest { bottom: 22.5dvh; left: calc(71vw - 45px); }
  .from-block { top: 9vh; }
  .save-block { top: 33%; }
  /* cover forces a wide envelope photo to fill a tall, narrow phone
     screen by blowing it up until the height fits, then cropping hard
     off both sides — background-position can only bias where that crop
     lands, not stop it. contain shows the whole envelope uncropped
     instead, letterboxed by .backdrop (already sitting behind it) —
     now a flat match to the envelope's own paper color, so the
     letterboxed strip reads as more envelope, not empty page. */
  .envelope-photo { background-size: contain; }

  /* ---- SAVE-THE-DATE SCREEN SPACING (phone portrait only) ----
     Reported: "Orlando" sits too close to the villa, "Scroll for more"
     isn't close enough to the bottom, and the gap from it down to
     "Formal invitation to follow" is too big. Desktop reads correctly
     and is untouched.

     Root cause is the UNIT, not the numbers. Both elements are
     absolutely positioned inside .stage, which is 100svh — but their
     offsets were vh. On desktop vh and svh are identical, so the base
     values look right. On a phone vh is the LARGE viewport (address bar
     hidden) while svh is the small one, so `bottom: 14vh` resolves
     against a taller reference than the box it lives in and both
     elements sit higher inside .stage than intended — squeezing the
     caption up against the villa above it while leaving too much room
     below the hint. Switching to svh makes the offsets resolve against
     the same height .stage itself uses.

     Measured at 390x844 with the villa fully slid in, before: villa
     bottom -> caption top 11px, caption -> hint 50px, hint -> screen
     bottom 51px. After: ~40 / ~41 / ~30 — the caption gets real
     separation from the villa, and the hint sits closer to the bottom
     edge, which also shortens the run into .closing-section below. */
  .villa-caption { bottom: 10.5svh; }
  .scroll-hint   { bottom: 3.5svh; }

  /* Third part of the same report: the gap between "Scroll for more"
     and "Formal invitation to follow". That gap is the hint's distance
     from .stage's bottom edge PLUS this section's own top padding —
     ~51 + 48 = ~99px before. The hint moving down (above) takes out
     ~21px; trimming the top padding here takes out another ~16px,
     landing around 62px. Only padding-top is overridden — the side and
     bottom padding from the base shorthand still apply. */
  .closing-section { padding-top: 2rem; }

}

/* ---- MOBILE LANDSCAPE ----
   A phone turned sideways is wide but very short, so the portrait
   "villa below the text" composition becomes vertically cramped.
   Use the available horizontal room instead: keep the save text on
   the left, put the villa on the right, and tighten purely decorative
   vertical elements. The max-height guard keeps this from changing
   iPad/tablet landscape layouts. */
@media (orientation: landscape) and (max-height: 500px) and (max-width: 1000px) {
  .from-block { top: 5dvh; }
  .from-eyebrow { margin-bottom: 1em; }
  .from-names {
    margin-top: 0.25em;
    /* Cap at 12dvh so the name doesn't dominate the cramped landscape
       height. At 375px height: 8vw=65px but 12dvh=45px → 45px wins
       (~12% of height vs 17% before). At 414px height: 12dvh=49.7px,
       still well legible. The clamp's 2.6rem floor stays in force — this
       is only a ceiling, not a replacement for the vw-based sizing. */
    font-size: min(clamp(2.6rem, 8vw, 4.2rem), 12dvh);
  }
  .open-line {
    bottom: 6dvh;
    font-size: clamp(0.72rem, 1.8vw, 0.95rem);
    letter-spacing: 0.28em;
  }
  .duque-rest {
    /* Raised from 9dvh to 17dvh to clear Oliver's run lane once Oliver
       is sized down (see .oliver-run below). At 375px height: Oliver top
       = ~53.6px; 17dvh = 63.75px gives a ~10px gap above him. Still
       well clear of .open-line (bottom:6dvh = 22.5px) — Duque's bottom
       edge is 41px above .open-line's bottom edge, no text collision. */
    bottom: 17dvh;
    left: calc(68vw - 45px);
    /* Width capped at 22dvh so Duque's height stays 12-14% of viewport
       height. At 375px: 22dvh=82.5px → height=82.5*(220/379)=47.8px
       (12.7%). The base clamp(90-140px) reads fine at portrait's 812px
       tall, but at 375px it renders oversized relative to the scene.
       aspect-ratio is NOT touched — only width changes, aspect-ratio
       drives height from width, preserving the sprite animation. */
    width: min(clamp(70px, 15vw, 105px), 22dvh);
  }
  /* Oliver: cap width at 25dvh so his height stays ~13-15% of viewport
     height in landscape. At 375px: 25dvh=93.75px → height=93.75*(220/385)
     =53.6px (14.3% of height). The base clamp(100-160px) hits its 160px
     ceiling here (24vw=194px clamped), making Oliver 91px tall — 24% of
     a 375px viewport, which dominates the scene. aspect-ratio and
     background-size are NOT overridden — those drive the frame-stepping
     animation and must remain untouched. */
  .oliver-run {
    width: min(clamp(100px, 24vw, 160px), 25dvh);
  }
  /* Ball: dvh cap matched to Oliver's to keep the tennis-ball-beside-a-
     dog ratio (~14% of Oliver's width) from the base rule. At 375px:
     3.5dvh=13.1px, which is 14% of Oliver's 93.75px — same ratio, smaller
     absolute size. aspect-ratio and background-size are NOT touched. */
  .ball-run {
    width: min(clamp(14px, 3.2vw, 22px), 3.5dvh);
  }
  .envelope-photo { background-size: contain; }
  .monogram {
    top: 13%;
    width: clamp(76px, 12vw, 110px);
  }
  .monogram .mono-letter {
    font-size: clamp(2.2rem, 6vw, 3.5rem);
  }
  .save-block {
    left: 0;
    right: 0;
    top: 32%;
    width: auto;
  }
  .save-eyebrow {
    font-size: clamp(0.7rem, 1.7vw, 0.9rem);
    margin-bottom: 0.45em;
    /* Keeps eyebrow/date tracking matched at this breakpoint too —
       .save-date tightens to 0.3em here (below), so eyebrow follows. */
    letter-spacing: 0.3em;
  }
  .save-tagline {
    font-size: clamp(3rem, 8vw, 5.2rem);
    margin-bottom: 0.25em;
  }
  .save-date {
    font-size: clamp(0.82rem, 1.8vw, 1.2rem);
    letter-spacing: 0.3em;
  }
  .villa-image {
    top: 50%;
    left: auto;
    /* Was 4vw — the 1.4x GSAP zoom expands outward from
       transform-origin:50% 60% (not right-edge-anchored), so it grows
       past a right offset sized for the unzoomed box. Confirmed by
       measuring the settled (post-zoom) position directly: at 812px
       wide (a landscape phone), 4vw put villa's right edge 14px past
       the viewport edge. 7vw clears it with ~10px to spare, verified
       at the same width, without introducing any overlap with the
       tagline text (86px gap there). */
    right: 7vw;
    margin: 0;
    width: min(34vw, 62dvh);
    max-width: none;
    transform: translateY(-50%) translateX(180%);
    /* Best-effort, unconfirmed fix for a reported "grey shade below
       the villa" here — see the synced copy of this rule further down
       (the one that actually wins on cascade) for the full reasoning.
       Kept identical here too, same as the rest of this rule. */
    filter: drop-shadow(0 8px 16px rgba(30, 20, 10, 0.22));
  }
  .villa-caption {
    /* Was left:auto;right:5vw;width:36vw — right-anchored in a narrow
       box near the villa. text-align:center (inherited from the base
       rule) only centers the text WITHIN that narrow box, not across
       the screen, so it read as stuck off to the right rather than
       centered — reported directly. The base rule's left:0;right:0
       (centered across the full width, same convention used
       everywhere else this caption appears) isn't overridden here
       anymore, so it's back to that. */
    bottom: 5dvh;
    font-size: clamp(0.82rem, 1.8vw, 1.1rem);
    letter-spacing: 0.28em;
  }
  .scroll-hint {
    bottom: 2.5dvh;
    font-size: 0.72rem;
  }
  .closing-section {
    min-height: 100dvh;
    gap: 1.25rem;
    padding-top: 2rem;
  }
  .countdown-num {
    font-size: clamp(1.7rem, 5vw, 2.4rem);
  }
}

/* ---- VILLA BELOW TEXT: phones AND tablets (not just phones) ----
   Was folded into the max-width:480px phone block above with the
   villa-image rule living there too — but an iPad (744-1024px
   portrait) isn't caught by that breakpoint at all, so it was getting
   the DESKTOP side-by-side layout (villa right:6vw, beside the text)
   meant for genuinely wide windows. At tablet widths that's nowhere
   near enough room: villa's zoomed size (scale 1.4 via GSAP) plus
   right-anchoring pushed it clean off the right edge of an actual
   iPad, while overlapping the tagline text directly — confirmed with
   real measurements at 820px width (villa's right edge landed 49px
   past the viewport edge, tagline text 354px deep inside villa's own
   box). Centering it below the text instead of beside it fixes the
   horizontal collision, but sizing it with `vw` (like the old
   phone-only 62vw, and a first attempt at 44vw here) doesn't work
   across the tablet range — the thing that actually constrains villa
   here is fitting in the VERTICAL band between the date text above
   and .villa-caption below, and that band's size is driven by
   viewport HEIGHT (top%/bottom:vh values), not width. A width tuned
   to fit at one aspect ratio (744x1133) overlapped at another
   (1024x1366) despite both being "tablet width" — confirmed by
   directly measuring the gap on both sides of villa, not just eyeballing
   it. Sizing with `vh` instead ties villa's size to the same axis as
   the constraint, and one value (24vh) holds up with real margin
   across the actual range tested: 375/744/820/1024px wide (this
   replaces the old phone-only rule too, not just adds a tablet one),
   heights 812/1133/1180/1366 — swept top% and width independently at
   each before landing on top:66% + width:24vh as the combination that
   clears both edges everywhere tested. */
@media (max-width: 1024px) {
  .villa-image {
    top: 66%;
    left: 0;
    right: 0;
    margin: 0 auto;
    /* translateX(150%) — the desktop value — doesn't reliably clear
       the viewport here: it's a percentage of villa's OWN width, and
       since width is now vh-based (24vh) rather than the desktop
       rule's vw-based one, that self-relative percentage no longer
       scales with viewport WIDTH the way it used to. Confirmed as a
       real bug (not hypothetical): at 1024px wide, villa's left edge
       sat 184px inside the visible viewport even before any scroll
       had happened. 300% clears it with real margin (~300px) at the
       widest portrait width tested (1024px). */
    transform: translateY(-50%) translateX(300%);
    width: 24vh;
    max-width: none;
  }
  /* Narrow portrait/tablet (<=1024px, not phone landscape): no
     horizontal shift (villa is below, not beside the text), and a
     slight rise to close the gap the villa creates underneath.
     Phone-landscape overrides these further down in source order,
     since max-width:1000px is a subset of max-width:1024px and the
     later rule wins on cascade. */
  .save-block {
    --shift-x: 0vw;
    --shift-y: -9vh;
  }
}

/* Landscape-phone villa override must come AFTER the generic
   max-width:1024px portrait/tablet rule above so CSS source order does
   not pull the villa back underneath the text. */
@media (orientation: landscape) and (max-height: 500px) and (max-width: 1000px) {
  .villa-image {
    top: 50%;
    left: auto;
    /* Kept in sync with the same rule's earlier occurrence above —
       see that one for why 7vw, not 4vw. This is the copy that
       actually wins on cascade (later source order), so this is the
       value that matters in practice. */
    right: 7vw;
    margin: 0;
    width: min(34vw, 62dvh);
    max-width: none;
    transform: translateY(-50%) translateX(180%);
    /* Best-effort, unconfirmed: reported "weird grey shade below the
       villa, only in landscape phones" but the actual screenshot for
       this one didn't come through, so this is reasoned from the
       code, not something I've seen. The only grey-ish thing near
       the villa anywhere in this file is its own drop-shadow (base
       rule, non-media-query) — a dark desaturated brown that can read
       as grey against parchment. It's fixed-px (18px offset, 34px
       blur), so it doesn't shrink along with villa's own much smaller
       size here (~230px vs 400-700px+ elsewhere) — proportionally a
       much heavier-looking shadow relative to the image than anywhere
       else on the page. Scaled down to roughly match the size ratio.
       If this isn't actually the cause, the screenshot would help
       narrow it down properly instead of guessing again. */
    filter: drop-shadow(0 8px 16px rgba(30, 20, 10, 0.22));
  }
  /* Phone landscape: villa is beside the text (right side), so the
     text shifts left like on desktop — but the available width is
     narrower so -20vw rather than -22vw. No vertical rise needed.
     This block must come AFTER the max-width:1024px block above so
     it wins on cascade (both blocks match a landscape phone, and
     max-width:1000px is a subset of max-width:1024px — later source
     order is the tiebreaker). */
  .save-block {
    --shift-x: -20vw;
    --shift-y: 0vh;
  }
}

/* ---- LANDSCAPE iPAD: keep desktop's side-by-side layout, shrink villa ----
   Landscape iPads (1025-1366px wide) already fall through to the
   plain desktop .villa-image rule below, since they're wider than the
   max-width:1024px block above — and that's the right call (confirmed
   good by direct feedback: side-by-side reads correctly here, unlike
   portrait). The problem is villa's desktop SIZE, not its layout: the
   desktop rule's width:60vw/max-width:540px, zoomed 1.4x by GSAP,
   renders at ~756px — comfortably fits a real ≥1440px desktop window
   but overlaps the tagline text at these narrower widths (confirmed:
   at 1194px, villa spanned 474-1230px while the tagline text spanned
   92-576px, direct overlap, and villa's own right edge landed 36px
   past the viewport too). Shrinking max-width/width for just this
   range clears both problems — checked at 1133/1194/1366px (the
   realistic landscape iPad spread) with 100px+ of margin on every
   side at all three, without touching position/top/right, which
   didn't need changing. 1400px upper bound leaves a little headroom
   past the widest common landscape iPad (1366) before handing off to
   the untouched, unconstrained desktop rule. */
@media (min-width: 1025px) and (max-width: 1400px) {
  .villa-image {
    width: 34vw;
    max-width: 300px;
  }
}

/* ---- REDUCED MOTION: everything visible immediately, no animation ---- */
@media (prefers-reduced-motion: reduce) {
  .envelope-photo,
  .open-line,
  .from-eyebrow,
  .from-names .letter,
  .sky-photo,
  .sky-scrim,
  .closing-section,
  .duque-rest {
    opacity: 1 !important;
    transform: none !important;
  }
  /* Oliver and the ball are decorative motion, not a state to freeze
     in place — just hide them entirely for reduced-motion users. */
  .oliver-run,
  .ball-run {
    display: none;
  }
  /* Duque is just lying there — freezing on his first frame (rather
     than hiding him like the runners) looks like a normal static
     illustration, not a broken animation. His base opacity is 0,
     normally raised to 1 by introTl below — but that whole timeline
     is skipped for reduced-motion (see the `if` around it), so he
     also needs the opacity:1 !important above; without it he'd stay
     permanently invisible instead of frozen-visible. */
  .duque-rest {
    animation: none;
  }
  /* Villa now lives in the SAME .stage as the couple photo/monogram —
     without the scroll-driven animation (skipped entirely for reduced
     motion), both would end up permanently visible and overlapping in
     the same spot. Simplest safe fallback: keep the couple/monogram/
     date scene exactly as it already worked, and leave the villa
     hidden entirely for reduced-motion users rather than risk a broken
     overlap. */
  .villa-caption,
  .villa-image {
    opacity: 0 !important;
  }
}
</style>

<body>
<noscript><style>body { visibility: visible !important; }</style></noscript>

<!-- Wraps .stage + .scroll-spacer specifically so .stage's sticky
     pinning is bounded to just this pair — sticky's release point is
     governed by how much of its PARENT remains below it, so without
     this wrapper, adding .closing-section as a later sibling of .stage
     (both direct children of body) would extend .stage's pinned range
     to cover .closing-section's scroll distance too, overlapping the
     two instead of handing off cleanly. -->
<div class="couple-villa-scroll">
<div class="stage">
  <div class="backdrop"></div>

    <div class="sky-photo" role="img" aria-label="Edgar and Vilma on the beach"></div>
    <div class="sky-scrim"></div>

    <!-- Villa lives here, not after .sky-scene — DOM order is stacking
         order, so this puts it above the couple photo/scrim (which it's
         replacing) but still BELOW the monogram/save-block text right
         below, so that text stays legible on top of it as it slides in
         instead of getting covered. -->
    <div class="villa-image" role="img" aria-label="Watercolor illustration of the Tuscan-style villa"></div>

    <div class="bird bird-a"><svg viewBox="0 0 24 12" fill="none"><path d="M1 8C4 3 8 3 12 7C16 3 20 3 23 8" stroke="#5A4A38" stroke-width="1.4" stroke-linecap="round"/></svg></div>
    <div class="bird bird-b"><svg viewBox="0 0 24 12" fill="none"><path d="M1 8C4 3 8 3 12 7C16 3 20 3 23 8" stroke="#5A4A38" stroke-width="1.4" stroke-linecap="round"/></svg></div>
    <div class="bird bird-c"><svg viewBox="0 0 24 12" fill="none"><path d="M1 8C4 3 8 3 12 7C16 3 20 3 23 8" stroke="#5A4A38" stroke-width="1.4" stroke-linecap="round"/></svg></div>

      <div class="save-tagline">Save the date</div>

      ><span class="letter" aria-hidden="true">r</span

      ><span class="letter" aria-hidden="true">a</span

<!-- No visible content — just scroll room so the sticky-pinned .stage

<!-- Normal document flow, not sticky — appears as .stage scrolls away

<div class="closing-section">
  <div class="invitation-note">Formal invitation to follow</div>

      <span class="countdown-num" id="cdSecs">00</span>
      <span class="countdown-label" id="cdSecsLabel">Sec</span>
