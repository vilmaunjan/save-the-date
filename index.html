<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>A Love Letter — Edgar &amp; Vilma</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,400&family=EB+Garamond:ital,wght@0,400;0,500;1,400&family=Cinzel&family=Mrs+Saint+Delafield&display=swap" rel="stylesheet">
<style>
/* ---- TOKENS (same palette as villa.html, for continuity) ---- */
:root {
  --parchment: #F7F1E4;
  --clay:      #C97C5D;
  --stone:     #E6C79A;
  --sage:      #6C7C58;
  --sky:       #AFC9D6;
  --ink:       #3B322A;
  --gold:      #B8912F;
  /* Sampled directly from envelope.jpeg's own background border
     (averaged a handful of corner/edge pixels — landed on ~#EDE4DB
     consistently), so anything showing through around the envelope
     matches its paper color exactly instead of visibly seaming into
     the page's own (slightly different) sky/parchment tones. */
  --envelope-cream: #EDE4DB;
}

*, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

/* background: matches body, as a fallback behind the page.
   overscroll-behavior-y: none disables the browser's elastic bounce/
   rubber-band effect at the top/bottom of the scrollable range on
   trackpad/touch — that bounce is what was briefly exposing a gap
   behind the sky-scene, no matter what color sits behind it. Removing
   the bounce removes the gap entirely. */
html {
  height: 100%;
  background: var(--parchment);
  overscroll-behavior-y: none;
}

body {
  min-height: 100%;
  font-family: 'EB Garamond', serif;
  color: var(--ink);
  background: var(--parchment);
  overscroll-behavior-y: none;
  /* Locked (no scroll) during the envelope intro — there's nothing to
     scroll to yet anyway, but this keeps it explicit. Unlocked by JS
     once the click reveal finishes, so scrolling down through
     .scroll-spacer fades the couple photo in behind the sky-scene text. */
  overflow: hidden;
  /* Hidden until JS confirms the scroll position is actually 0 and
     reveals it (see the script) — the browser can restore a previous
     scroll position and paint that frame before our own JS gets a
     chance to correct it, which is exactly the "flash mid-scroll, then
     jump to top" you were seeing. Hiding first means there's nothing to
     flash regardless of how that timing race plays out. */
  visibility: hidden;
}
body.unlocked { overflow: auto; }
body.revealed { visibility: visible; }

/* ---- STAGE: fills the first viewport (envelope intro + sky-scene reveal) ---- */
.stage {
  /* sticky, not relative — stays pinned at the top of the viewport as
     you scroll, same pattern as .viewport-pin on the main site, instead
     of scrolling away together with the photo underneath it. */
  position: sticky;
  top: 0;
  width: 100vw;
  height: 100dvh;
  overflow: hidden;
  cursor: pointer; /* hints the whole screen is clickable, matching "Open the invitation" */
}

/* Sky/parchment backdrop behind the envelope — the envelope's own
   background is genuinely transparent now (chroma-keyed out of the
   original photo's black backdrop), so this shows through wherever
   `cover` sizing doesn't have envelope pixels to show (i.e. barely
   anywhere, but it's there for any edge case). */
.backdrop {
  position: absolute;
  inset: 0;
  /* Was a sky-to-parchment gradient — but this is specifically what
     shows through around/behind the envelope (its own gaps on desktop
     `cover`, and the letterboxed edges on mobile `contain`), so a flat
     match to the envelope's own paper color reads as one continuous
     surface instead of the envelope visibly sitting on top of a
     different-colored page. */
  background: var(--envelope-cream);
}

/* ---- SKY SCENE — revealed on click ----
   Sits behind the envelope in the DOM (so it stacks underneath with no
   z-index needed) and starts fully transparent. A click fades the
   envelope out and this in together, revealing open sky with birds.
   Same gradient tokens and bird line-art as the finished villa.html
   site, for visual continuity between the two pieces. */
.sky-scene {
  position: absolute;
  inset: 0;
  opacity: 0;
}
.sky-scene .sky-bg {
  position: absolute;
  inset: 0;
  background: linear-gradient(to bottom, var(--sky) 0%, var(--parchment) 65%);
}

/* Couple photo, now living behind the monogram/"Save the date" text
   instead of a separate flat section — this is the "blend" the sky-bg
   gradient alone couldn't give. Sits on top of .sky-bg (covers it
   entirely with `cover` sizing, so the gradient is just a fallback for
   any edge the photo doesn't reach) and underneath the scrim + text,
   per DOM order. */
.sky-scene .sky-photo {
  position: absolute;
  /* top:-100px (not inset:0's top:0) is the actual fix for the hard top
     edge — the box now starts 100px above the container, well past the
     70px it ever gets shifted down by the translateY animation below.
     So at every point in that animation, its rendered top edge stays at
     or above y=0: -100+70=-30px at the very start, -100+0=-100px at
     rest. It never dips below 0, which means it never opens a gap that
     exposes .sky-bg's flat blue underneath — that exposed-gap, not the
     photo's own edge, was the actual hard line (masking the photo's own
     top, tried earlier, did nothing because the photo's box — mask
     included — was sliding down as a whole, gap and all, along with it).
     (70px, up from 20px, so it starts noticeably lower/further down
     before rising in — the overextension above had to grow to match, to
     keep the same never-reveals-a-gap guarantee.) .stage's
     overflow:hidden clips the overextension itself, so nothing spills
     past the visible screen. */
  top: -100px;
  left: 0;
  right: 0;
  bottom: 0;
  background-image: url('couple-2.webp');
  background-repeat: no-repeat;
  background-size: cover;
  /* Was "center 30%" — the couple isn't actually centered in the photo
     itself (Vilma sits left-of-center, Edgar further right, roughly
     around the 57% mark across the image), so on narrow/mobile crop
     windows (much narrower than the full photo under `cover`), a
     geometric 50% center crops disproportionately into Edgar's side.
     57% biases the crop window to actually center on the two of them
     together, not the photo's raw midpoint. */
  background-position: 57% 30%;
  /* Starts hidden even once .sky-scene itself is fully visible after the
     click — this and .sky-scrim fade in together on scroll (see the
     ScrollTrigger below), not immediately on click. Opacity here
     compounds with .sky-scene's own opacity, so it stays invisible
     until both are true. Also starts nudged down slightly, rising into
     place as it fades — a small "coming from below" touch rather than
     just a flat crossfade. */
  opacity: 0;
  transform: translateY(70px);
  /* Dissolve-wipe for the exit (see the JS timeline): --wipe is a plain
     percentage GSAP animates directly. The mask is fully opaque (black)
     everywhere until --wipe rises above 0, at which point the region
     from the RIGHT edge up to --wipe becomes transparent — "to left"
     means the gradient's 0% stop sits at the right edge, 100% at the
     left, so growing --wipe erases right-to-left. The ~20-point gap
     between the two transparent/black stops is the feather: a soft,
     gradual dissolve rather than a hard-edged wipe. blur grows in the
     same tween, so what's left as it erases also softens instead of
     staying crisply defined right up until it disappears — together
     these read as falling apart, not sliding away.  */
  --wipe: 0%;
  -webkit-mask-image: linear-gradient(to left, transparent 0%, transparent var(--wipe), black calc(var(--wipe) + 22%), black 100%);
  mask-image: linear-gradient(to left, transparent 0%, transparent var(--wipe), black calc(var(--wipe) + 22%), black 100%);
  filter: blur(0px);
  /* Hints the browser to promote this to its own compositing layer
     ahead of time, rather than discovering mid-scroll that it needs
     to — this element animates transform, opacity, mask, AND filter
     simultaneously, about as much per-frame work as anything on this
     page does. */
  will-change: transform, opacity, filter;
}

/* Parchment-tinted wash over the photo so the ink-colored monogram and
   "Save the date" text stay legible against a busy image — heavier
   behind the monogram/tagline near the top, easing off through the
   middle so the photo still reads as a photo, not just a texture. */
.sky-scene .sky-scrim {
  position: absolute;
  /* Same overextended top as .sky-photo (now -100px, matching its 70px
     rise), same reason — keeps this from opening its own gap above the
     photo while it's rising into place. */
  top: -100px;
  left: 0;
  right: 0;
  bottom: 0;
  background: linear-gradient(
    to bottom,
    rgba(247, 241, 228, 0.78) 0%,
    rgba(247, 241, 228, 0.5) 32%,
    rgba(247, 241, 228, 0.38) 60%,
    rgba(247, 241, 228, 0.62) 100%
  );
  /* Fades in together with .sky-photo — no scrim needed while there's no
     photo underneath it yet. Same rise (70px, up from 20px, so it starts
     further down the screen), so the two move as one rather than the
     scrim staying static while the photo shifts under it. Same
     dissolve-wipe treatment as .sky-photo, in sync, so the scrim doesn't
     linger as a flat rectangle after the photo underneath it has already
     dissolved away. */
  opacity: 0;
  transform: translateY(70px);
  --wipe: 0%;
  -webkit-mask-image: linear-gradient(to left, transparent 0%, transparent var(--wipe), black calc(var(--wipe) + 22%), black 100%);
  mask-image: linear-gradient(to left, transparent 0%, transparent var(--wipe), black calc(var(--wipe) + 22%), black 100%);
  filter: blur(0px);
  will-change: transform, opacity, filter;
}

/* Pure scroll room — no content of its own. Gives the (sticky-pinned)
   .stage something to scroll against so everything below has a scroll
   distance to animate across: couple fade-in, a hold, couple-exits/
   villa-enters together, villa's continued push-in, then the caption.
   All of it now lives inside the ONE .stage/.scroll-spacer pair — the
   couple photo and villa used to be two separate pinned scenes handed
   off sequentially, but that meant they could never be on screen at
   the same time, which is what "villa starts appearing as the couple
   starts exiting" actually requires. Taller than the single-beat
   100dvh it used to be (this now covers five choreographed beats
   instead of one), so .stage stays pinned that much longer too. */
.scroll-spacer {
  /* Must match .stage's unit (100dvh, not 100vh) — dvh resizes with the
     mobile browser's address bar as it shows/hides, vh doesn't. If the
     two disagree at page load, this spacer's top edge lands somewhere
     other than a full screen's worth of scroll below .stage, so the
     ScrollTrigger fade below reads its "start" point as already passed
     before you've scrolled anything. */
  /* Was 210dvh, sized for a timeline that ran all the way to 6.8 —
     shrunk to 170dvh now that the zoom/text tweens end at 5.5 instead,
     so the scroll distance still maps 1:1 onto the shortened timeline
     rather than leaving a stretch of "dead" scroll at the end where
     nothing was still animating. */
  height: 170dvh;
}

/* ---- VILLA — now a layer inside .stage, not its own scene ----
   villa-cutout.webp: same transparent cutout villa.html uses. Used to
   be a full inset:0 box filling the whole stage; now a much smaller,
   deliberately sized box (42vw, capped at 380px, square to match the
   source image's actual 1024x1024 dimensions) anchored near the right
   edge (right: 6vw) instead — "smaller" and "final spot on the right"
   are really the same change: the box's resting size/position IS its
   final spot, everything else is just animated relative to that. No
   backdrop of its own — .stage's own background shows through
   (parchment, since .backdrop is the envelope-cream color and .sky-bg's
   gradient has long since faded to parchment by the time this is
   visible), rather than the sky-to-parchment gradient used earlier in
   the scene. */
.villa-image {
  position: absolute;
  /* Was 50% — with the zoom now reaching scale 1.4 (up from 1.12), the
     enlarged villa was growing down far enough to overlap
     .villa-caption sitting at bottom:14vh. Moved up to give it
     clearance. */
  top: 42%;
  right: 6vw;
  /* Was 42vw/380px, then 48vw/430px — bumped up more this time. */
  width: 60vw;
  max-width: 540px;
  aspect-ratio: 1 / 1;
  background-image: url('villa-cutout.webp');
  background-repeat: no-repeat;
  background-size: contain;
  background-position: center center;
  filter: drop-shadow(0 18px 34px rgba(30, 20, 10, 0.22));
  transform-origin: 50% 60%;
  /* translateY(-50%) is baseline vertical centering (top:50% + this).
     translateX(150%) starts it well off-screen to the right of its own
     resting spot (right: 6vw) — the slide-in tween below animates x
     down to 0, which is what actually lands it at that resting
     position. GSAP tracks translateX/Y as independent components, so
     animating x alone doesn't disturb the y centering. */
  transform: translateY(-50%) translateX(150%);
  will-change: transform;
}
.villa-caption {
  position: absolute;
  left: 0;
  right: 0;
  bottom: 14vh;
  text-align: center;
  font-family: 'EB Garamond', serif;
  font-weight: 600;
  /* Was clamp(1rem, 2.6vw, 1.35rem) — bumped up. */
  font-size: clamp(1.3rem, 3.4vw, 1.8rem);
  text-transform: uppercase;
  letter-spacing: 0.4em;
  color: var(--ink);
  opacity: 0;
  padding-left: 0.4em;
}

/* A small "scroll for more" cue at the bottom of the sky scene, fading
   in with everything else — scrolling is what fades the couple photo in
   behind the monogram/text, so this hints that there's more to see. */
.scroll-hint {
  position: absolute;
  left: 0;
  right: 0;
  bottom: 6vh;
  text-align: center;
  font-family: 'EB Garamond', serif;
  font-style: italic;
  font-size: clamp(0.72rem, 1.6vw, 0.85rem);
  text-transform: uppercase;
  letter-spacing: 0.3em;
  color: var(--ink);
  opacity: 0.55;
}

.bird {
  position: absolute;
  width: 26px;
  height: auto;
  opacity: 0;
  pointer-events: none;
}
.bird svg { width: 100%; height: 100%; display: block; }
.bird-a { top: 18%; animation: flyA 19s linear infinite; animation-delay: 0.5s; }
.bird-b { top: 26%; width: 19px; animation: flyB 23s linear infinite; animation-delay: 4s; }
.bird-c { top: 12%; width: 16px; animation: flyA 27s linear infinite; animation-delay: 8s; }
@keyframes flyA {
  0%   { left: -5%;  opacity: 0; }
  5%   { opacity: 0.6; }
  95%  { opacity: 0.6; }
  100% { left: 106%; opacity: 0; }
}
@keyframes flyB {
  0%   { left: 110%; opacity: 0; }
  5%   { opacity: 0.42; }
  95%  { opacity: 0.42; }
  100% { left: -6%;  opacity: 0; }
}

/* ---- MONOGRAM — the sky scene's centerpiece ----
   E and V as two large serif letters, deliberately overlapping rather
   than sitting side by side — the classic engraved-crest look, like the
   wax seal on the envelope but scaled up into the focal element of this
   scene. V sits in front (higher in the DOM = on top with no z-index
   needed) so its shape naturally cuts across E where they intersect,
   the way two overlapping letters actually look engraved/pressed
   together rather than just stacked. */
.monogram {
  position: absolute;
  left: 50%;
  top: 10%;
  transform: translate(-50%, -50%);
  width: clamp(95px, 18vw, 160px);
  aspect-ratio: 1 / 1;
  pointer-events: none;
}
.monogram .mono-letter {
  position: absolute;
  top: 50%;
  /* Cinzel: geometric, evenly-weighted Roman capitals — the classic
     engraved/wax-seal monogram look, distinct on purpose from the
     Cormorant Garamond used everywhere else on this page; monograms
     traditionally get their own dedicated display face. */
  font-family: 'Cinzel', serif;
  line-height: 1;
  font-size: clamp(2.6rem, 8vw, 4.8rem);
  /* Same ink color as the rest of the text now, for consistency —
     was gold. */
  color: var(--ink);
}
.mono-e {
  left: 42%;
  transform: translate(-50%, -50%);
}
.mono-v {
  left: 58%;
  /* Same top as E (50%, inherited) — the drop comes from the extra
     translateY below, sized off the letter's own font-size rather than
     the small monogram box's percentage height, so it scales correctly
     at any screen size. Was 0.5em, then 0.35em, eased back once more. */
  transform: translate(-50%, -50%) translateY(0.22em);
}

/* ---- SAVE-THE-DATE BLOCK — below the monogram, same scene ----
   Matches the font/spacing pattern from the reference: a loose cursive
   tagline, then a tracked-out serif caps date, then bigger tracked-out
   serif caps names. No separate reveal animation — rides along with
   .sky-scene's own opacity fade, same as the monogram and birds. */
.save-block {
  position: absolute;
  left: 0;
  right: 0;
  top: 36%;
  text-align: center;
  will-change: transform;
}

.save-tagline {
  font-family: 'Mrs Saint Delafield', cursive;
  font-size: clamp(4.4rem, 14vw, 7.4rem);
  line-height: 1;
  color: var(--ink);
  margin-bottom: 0.5em;
}

.save-date {
  font-family: 'EB Garamond', serif;
  font-weight: 500;
  font-size: clamp(1.1rem, 2.8vw, 1.5rem);
  text-transform: uppercase;
  letter-spacing: 0.38em;
  color: var(--ink);
  opacity: 0.8;
  /* nudge right to visually re-center against the letter-spacing,
     which otherwise pushes the whole line slightly left */
  padding-left: 0.38em;
}

/* Full-bleed envelope, filling the entire screen edge-to-edge.
   cover (not contain) per "make it fit the whole screen" — this crops
   rather than letterboxes. This version of envelope.jpeg already has a
   soft cream backdrop (no chroma-key needed like the first version did),
   which reads as a continuation of the page's own parchment tone rather
   than a hard edge. background-position biased slightly above center
   keeps the wax seal and scalloped flap comfortably in frame even when
   a narrow phone screen crops the sides more aggressively than a wide
   desktop window would. */
.envelope-photo {
  position: absolute;
  inset: 0;
  background-image: url('envelope.jpeg');
  background-repeat: no-repeat;
  background-size: cover;
  background-position: center 42%;
  opacity: 0;
  transform: scale(1.02);
}

/* ---- "Open the invitation" — bottom of the screen ---- */
.open-line {
  position: absolute;
  left: 0;
  right: 0;
  bottom: 8vh;
  text-align: center;
  font-family: 'EB Garamond', serif;
  font-style: italic;
  font-weight: 600;
  font-size: clamp(0.85rem, 2.2vw, 1.15rem);
  text-transform: uppercase;
  letter-spacing: 0.42em;
  color: var(--ink);
  opacity: 0;
  z-index: 2;
}

/* ---- "A Love letter from / Edgar & Vilma" — top of the screen ---- */
.from-block {
  position: absolute;
  left: 0;
  right: 0;
  top: 12vh;
  text-align: center;
  z-index: 2;
}

.from-eyebrow {
  font-family: 'EB Garamond', serif;
  font-style: italic;
  font-weight: 500;
  font-size: clamp(0.72rem, 1.8vw, 0.92rem);
  text-transform: uppercase;
  letter-spacing: 0.34em;
  color: var(--ink);
  /* More separation from the names below — was 0.35em, then 1.1em, then 2em. */
  margin-bottom: 2.6em;
  opacity: 0;
}

.from-names {
  /* Same font as "Save the date" in the sky scene, for consistency
     between the two cursive moments on the page. */
  font-family: 'Mrs Saint Delafield', cursive;
  font-size: clamp(2.8rem, 8vw, 4.6rem);
  line-height: 1;
  color: var(--ink);
  margin-top: 0.9em;
  /* No opacity/transition here anymore — each .letter span inside
     handles its own reveal now (see the per-letter stagger below), so
     the container itself just needs to be visible from the start. */
}

/* Each character of "Edgar & Vilma" is its own inline-block span so
   GSAP can stagger them in one at a time, like the name being written
   one letter at a time. */
.from-names .letter {
  display: inline-block;
  opacity: 0;
}

/* ---- CLOSING SECTION — normal document flow, after .scroll-spacer ----
   Not sticky-pinned like .stage — it doesn't need its own scroll
   choreography, it just sits in normal flow and appears naturally as
   .stage scrolls away above it once .scroll-spacer's range is used up
   (same mechanic that already hands off couple-photo to villa). Simple
   fade+rise on scroll-into-view (see the script), not the elaborate
   scrubbed timeline the scenes above use — this is a closing beat, not
   another whole scene. */
.closing-section {
  /* Was min-height:90vh + justify-content:center — centering content
     inside a tall box leaves a large empty area ABOVE it (roughly half
     the box's height), which is what was reading as "a big gap" right
     after .stage scrolls away. Shorter box, content anchored toward the
     top with a modest fixed padding instead of centered — content now
     starts close to where .stage hands off, not floating in the middle
     of a mostly-empty section. */
  min-height: 55vh;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: flex-start;
  gap: clamp(2rem, 6vw, 3.5rem);
  padding: 3rem 1.5rem 4rem;
  text-align: center;
  background: var(--parchment);
  opacity: 0;
  transform: translateY(30px);
}

.invitation-note {
  font-family: 'EB Garamond', serif;
  font-style: italic;
  font-weight: 600;
  font-size: clamp(0.9rem, 2.2vw, 1.15rem);
  text-transform: uppercase;
  letter-spacing: 0.42em;
  color: var(--ink);
  /* nudge right to visually re-center against the letter-spacing,
     same fix used on .save-date/.open-line elsewhere on this page */
  padding-left: 0.42em;
}

.calendar-block {
  display: flex;
  flex-direction: column;
  align-items: center;
}

.calendar-btn {
  display: inline-block;
  font-family: 'EB Garamond', serif;
  font-weight: 600;
  font-size: clamp(0.85rem, 2vw, 1rem);
  text-transform: uppercase;
  letter-spacing: 0.28em;
  color: var(--ink);
  text-decoration: none;
  border: 1px solid var(--ink);
  padding: 0.9em 2.2em;
  border-radius: 2px;
  /* Re-centers the label against its own letter-spacing, same idea as
     .save-date's padding-left trick. */
  padding-left: 2.48em;
  transition: background 0.25s ease, color 0.25s ease;
}
.calendar-btn:hover {
  background: var(--ink);
  color: var(--parchment);
}

.calendar-alt {
  display: inline-block;
  margin-top: 1.1em;
  font-family: 'EB Garamond', serif;
  font-style: italic;
  font-size: clamp(0.75rem, 1.6vw, 0.85rem);
  color: var(--ink);
  opacity: 0.65;
}

.countdown {
  display: flex;
  justify-content: center;
  gap: clamp(1.1rem, 4vw, 2.6rem);
}
.countdown-unit {
  display: flex;
  flex-direction: column;
  align-items: center;
  min-width: 3.2em;
}
.countdown-num {
  font-family: 'Cormorant Garamond', serif;
  font-weight: 600;
  font-size: clamp(2rem, 6vw, 3.2rem);
  color: var(--ink);
  line-height: 1;
  /* Locks digit width so the countdown doesn't visibly jitter/reflow
     every second as digit widths change (e.g. "1" vs "8"). */
  font-variant-numeric: tabular-nums;
}
.countdown-label {
  font-family: 'EB Garamond', serif;
  font-size: clamp(0.65rem, 1.4vw, 0.78rem);
  text-transform: uppercase;
  letter-spacing: 0.25em;
  color: var(--ink);
  opacity: 0.65;
  margin-top: 0.6em;
  padding-left: 0.25em;
}

/* ---- MOBILE ---- */
@media (max-width: 480px) {
  /* Was bottom:6vh — on mobile, .envelope-photo switches to
     background-size:contain (see below), which no longer fills the
     screen edge-to-edge, so the envelope's actual bottom edge sits well
     above the screen's bottom edge. 20dvh roughly splits the difference
     between the two instead of pinning tight to the bottom, which used
     to leave a big empty gap above the text and cram it too close to
     the edge. dvh (not vh), matching .stage, so this doesn't drift on
     phones where the address bar changes the viewport height. */
  .open-line  { bottom: 20dvh; letter-spacing: 0.3em; }
  .from-block { top: 9vh; }
  .save-block { top: 33%; }
  /* cover forces a wide envelope photo to fill a tall, narrow phone
     screen by blowing it up until the height fits, then cropping hard
     off both sides — background-position can only bias where that crop
     lands, not stop it. contain shows the whole envelope uncropped
     instead, letterboxed by .backdrop (already sitting behind it) —
     now a flat match to the envelope's own paper color, so the
     letterboxed strip reads as more envelope, not empty page. */
  .envelope-photo { background-size: contain; }

  /* Side-by-side (villa right, text center-ish) works on desktop
     because there's enough width for both — on a narrow phone, villa's
     size (60vw of a much smaller screen) collides with the text
     instead. Moving it down and centering it horizontally puts it
     BELOW the text rather than beside it, at this width only; desktop
     keeps the original right:6vw/top:50% side-by-side layout untouched.
     left:0/right:0/margin:auto (not a transform-based x-offset) is what
     actually centers it — GSAP's x tween ends at exactly 0%, so the
     resting position has to already BE centered with zero extra x
     applied, which margin:auto gives for free without needing a
     compensating transform value. transform here only handles vertical
     centering (translateY) plus the same 150% off-screen starting
     offset as desktop — GSAP's x tween still slides it in from the
     right, it just lands lower and centered instead of at the right
     edge, mid-height. */
  .villa-image {
    /* Was 82%, then 66% — same reason as the desktop rule above: the
       bigger scale-1.4 zoom was overlapping .villa-caption at the
       bottom. Moved up further to 56%. */
    top: 56%;
    left: 0;
    right: 0;
    margin: 0 auto;
    transform: translateY(-50%) translateX(150%);
    width: 62vw;
    max-width: none;
  }
}

  .open-line,
  .from-eyebrow,
  .from-names .letter,
  .sky-photo,
  .sky-scrim,
  .closing-section {
    opacity: 1 !important;
    transform: none !important;
  }

     without the scroll-driven animation (skipped entirely for reduced
     motion), both would end up permanently visible and overlapping in
     the same spot. Simplest safe fallback: keep the couple/monogram/
     date scene exactly as it already worked, and leave the villa
     hidden entirely for reduced-motion users rather than risk a broken
     overlap. */
  .villa-caption,
  .villa-image {
    opacity: 0 !important;
  }
}

<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/ScrollTrigger.min.js"></script>
<script>
// Browsers restore the previous scroll position on reload by default —
// with .stage's sticky-pinned choreography, landing mid-scroll on
// reload means the couple photo/villa/text are already partway (or all
// the way) through their transition even though you're looking at what
// should be the very first envelope screen. 'manual' stops the browser
// from doing that; the explicit scrollTo(0,0) is a belt-and-suspenders
// second guarantee in case scrollRestoration alone doesn't run in time
// on a given browser.
if ('scrollRestoration' in history) {
  history.scrollRestoration = 'manual';
}
window.scrollTo(0, 0);

// body starts visibility:hidden (see the CSS) specifically so this
// race can't produce a visible flash: the browser can restore a
// previous scroll position and paint that frame before this script has
// even run, no matter how early we call scrollTo. Instead of trying to
// out-race that, we wait it out — two rAFs give the browser's own
// restoration a couple of paint cycles to do whatever it's going to do
// — force scroll to 0 one last time after that, THEN reveal. Nothing
// gets shown to you until we're actually sure it's correct.
requestAnimationFrame(() => {
  requestAnimationFrame(() => {
    window.scrollTo(0, 0);
    document.body.classList.add('revealed');
  });
});
// Safety net: if anything above throws or a browser quirk stops the
// rAF chain from ever firing, don't leave the page permanently
// invisible — reveal it regardless after a short timeout.
setTimeout(() => document.body.classList.add('revealed'), 800);

// Declared out here (not with const inside the block below) so the click
// handler further down can reach in and kill it if the envelope gets
// clicked before the intro sequence finishes playing.
let introTl;

if (!window.matchMedia('(prefers-reduced-motion: reduce)').matches) {

  gsap.registerPlugin(ScrollTrigger);

  // ONE master timeline, one shared ScrollTrigger spanning the entire
  // .scroll-spacer, choreographing six beats in order (elongated from
  // the previous version — longer fade-in since the couple now rises
  // from further down, and a longer hold/transition/zoom generally):
  //
  //   0    -> 1.4  couple photo fades/rises in (now from 70px down,
  //                was 20px — longer duration to match the bigger
  //                distance, so it doesn't feel rushed)
  //   1.4  -> 2.2  HOLD — nothing moves, reads as "arrived and settled"
  //                before anything else starts
  //   2.2  -> 5.0  couple dissolves away right-to-left (--wipe/blur/
  //                opacity) and villa slides in from the right
  //                (x: 150% -> 0, landing at its resting spot —
  //                right: 6vw in the CSS, not dead center or left)
  //   2.2  -> 6.8  the save-block text (tagline + date, NOT the
  //                monogram — that stays centered) slides left
  //                (x: 0 -> -22vw, finishing at 6.8 not 5.0 — extended
  //                so it settles at the same moment the zoom below
  //                does, not early) to balance against villa settling
  //                on the right
  //   3.0  -> 6.8  villa's slow zoom (scale 1 -> 1.4 — was 1.12, barely
  //                perceptible, bumped up for a genuinely noticeable
  //                push-in) — starts partway through the slide-in above
  //                (was tried at the slide's exact midpoint, 3.6, then
  //                pulled slightly earlier), not simultaneously with
  //                it, so sliding and zooming read as two connected but
  //                distinct beats rather than everything happening at
  //                once from frame one
  //   3.0  -> 6.8  "Orlando, FL, USA" fades in RIGHT AS the zoom starts
  //                and finishes exactly when it does too (was ending at
  //                4.5 — extended to stay in step with the zoom's own
  //                end instead of settling early)
  //
  // Total timeline duration is 5.5 (the latest end time above, was 6.8
  // — trimmed so nothing keeps animating well past the slide-in's own
  // finish at 5.0) — the scrub maps that 1:1 onto .scroll-spacer's full
  // scroll distance, so .scroll-spacer's height (170dvh, also shrunk to
  // match) doesn't leave a stretch of scroll at the end where nothing's
  // actually still happening.
  // On mobile the villa moved below the text instead of beside it (see
  // the @media block for .villa-image), so there's no longer anything
  // for the text to make room for by shifting left — and -22vw was
  // tuned against a wide desktop screen, so on a narrow phone that same
  // distance pushes the text far enough left to clip against .stage's
  // overflow:hidden. isMobileLayout picks 0 there instead.
  const isMobileLayout = window.matchMedia('(max-width: 480px)').matches;
  const saveBlockShift = isMobileLayout ? '0vw' : '-22vw';
  // Mobile-only: as the villa enlarges below the text (see the @media
  // block — villa sits below, not beside, on mobile), the save-block
  // was just sitting still at its original spot, leaving a noticeable
  // gap of empty space above it once the villa took up the bottom
  // portion of the screen. Rising slightly tightens that up. 0 on
  // desktop — the save-block already shifts left there instead, no
  // vertical gap to fix.
  const saveBlockRise = isMobileLayout ? '-9vh' : '0vh';

  gsap.timeline({
    scrollTrigger: {
      trigger: '.scroll-spacer',
      start: 'top bottom',
      end: 'bottom bottom',
      // Was 0.3 — a low scrub value tracks raw scroll position very
      // literally, which on a fast fling (large, irregular per-frame
      // scroll jumps, especially on touch) shows up as visibly choppy
      // motion rather than smooth. A higher value smooths that out —
      // the animation eases toward the current scroll position instead
      // of snapping straight to it every tick, effectively low-pass
      // filtering jittery scroll input into fluid motion. Trades a
      // touch of lag on slow, deliberate scrolling for a lot less jank
      // on fast ones.
      scrub: 0.6
    }
  })
    .to('.sky-photo, .sky-scrim', { opacity: 1, y: 0, ease: 'none', duration: 1.4 }, 0)
    // Was a physical x:'-100%' slide — swapped for a right-to-left
    // dissolve-wipe (--wipe, see the CSS) plus a growing blur, so it
    // reads as falling apart/vanishing in place rather than sliding
    // off-screen. 115% (not 100%) on --wipe accounts for the mask's own
    // 22-point feather, so the erased region actually reaches fully
    // past the left edge by the end instead of leaving a barely-visible
    // sliver. The opacity fade stays too, layered on top. blur target
    // was 10px — animated filter blur is one of the more expensive CSS
    // properties to recompute every frame (cost scales with the blur
    // radius, not linearly), and on a fast fling that was contributing
    // to visible choppiness. 5px still reads as a soft dissolve at a
    // meaningfully lower per-frame cost.
    .to('.sky-photo, .sky-scrim', { '--wipe': '115%', filter: 'blur(5px)', opacity: 0, ease: 'none', duration: 2.8 }, 2.2)
    // x:0 lands it exactly at the CSS's own resting position
    // (right: 6vw) — the 150% starting offset lives in the CSS's base
    // transform, not here. Spans 2.2 -> 5.0.
    .to('.villa-image', { x: '0%', ease: 'none', duration: 2.8 }, 2.2)
    // Was 3.6 (the slide-in's exact midpoint) — pulled earlier to 3.0,
    // so the zoom kicks in a bit sooner relative to the slide instead of
    // waiting all the way to the halfway mark. Scale target 1.4 for a
    // genuinely noticeable push-in. Duration 2.5 (ending at 5.5) — was
    // stretched to end at 6.8, well past the slide-in's own 5.0 finish,
    // which meant a long stretch of extra scroll distance for very
    // little visible change. 5.5 is just a touch past the slide-in
    // finishing (5.0), enough to read as "still settling in" rather
    // than snapping dead the instant the slide stops, without dragging
    // on for its own separate scroll distance.
    .to('.villa-image', { scale: 1.4, ease: 'none', duration: 2.5 }, 3.0)
    // .monogram deliberately left out here — stays centered while only
    // the save-block text shifts left, per feedback (desktop only —
    // saveBlockShift is 0 on mobile, see above). Ends at 5.5 now too,
    // matching the zoom's new, shorter end point.
    .to('.save-block', { x: saveBlockShift, ease: 'none', duration: 3.3 }, 2.2)
    // Separate tween (not merged into the one above) because it's
    // timed differently — starts at 3.0, matching the villa's zoom,
    // not 2.2 like the horizontal shift. 0 on desktop, so harmless
    // there. Ends at 5.5, same as the zoom.
    .to('.save-block', { y: saveBlockRise, ease: 'none', duration: 2.5 }, 3.0)
    // Shifted along with the zoom above (now 3.0), so it still appears
    // the instant the zoom starts. Ends at 5.5, in step with the zoom.
    .to('.villa-caption', { opacity: 1, ease: 'none', duration: 2.5 }, 3.0);

  // .closing-section: a plain fade+rise the moment it scrolls into
  // view, not tied to the master timeline above — it's not part of the
  // .stage choreography (it's not even inside .stage), it just sits in
  // normal flow and gets revealed once, like a simpler version of the
  // reveals used elsewhere on the page. toggleActions 'play none none
  // reverse' means it plays forward once you scroll to it and reverses
  // if you scroll back up past it, rather than the scrub-tied,
  // exactly-follows-your-finger motion the scenes above use.
  gsap.to('.closing-section', {
    opacity: 1,
    y: 0,
    duration: 1,
    ease: 'power2.out',
    scrollTrigger: {
      trigger: '.closing-section',
      start: 'top 85%',
      toggleActions: 'play none none reverse'
    }
  });

  /*
    Simple page-load sequence (no scroll yet — first beat of what will
    grow into a longer scroll-driven piece later):

      0.0s          envelope fades/settles in, full-bleed
      ~0.7s         "Open the invitation" fades in at the bottom
      ~0.9s         "A Love letter from" fades in at the top
      ~1.15s        "Edgar & Vilma" writes itself in one letter at a
                    time, like a signature

    "A Love letter from" no longer waits for "Open the invitation" to
    fully finish (that was 1.6s in) — it starts sooner now, overlapping
    the tail end of that reveal instead of queuing strictly after it.
    Assigned to `introTl` (not a bare const) so the click handler below
    can kill it outright.
  */
  introTl = gsap.timeline({ defaults: { ease: 'power2.out' } });

  introTl.to('.envelope-photo', { opacity: 1, scale: 1, duration: 1.1 }, 0)
    .to('.open-line', { opacity: 1, y: 0, duration: 0.9 }, 0.7)
    .to('.from-eyebrow', { opacity: 1, duration: 0.7 }, 0.9)
    // Per-letter "writing" reveal — each character of "Edgar & Vilma"
    // fades in on its own, staggered, rather than the whole name
    // appearing at once.
    .to('.from-names .letter', {
      opacity: 1,
      duration: 0.35,
      stagger: 0.055,
      ease: 'power1.out'
    }, 1.15);
}

/* ---- CLICK: envelope fades out, sky + birds fade in ----
   Works regardless of reduced-motion (the intro sequence above is
   gated, this isn't) — reduced-motion users just get an instant swap
   (duration 0) instead of an animated crossfade. Guarded with `opened`
   so a second click can't restart/stack the transition. */
let opened = false;
const reduceMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;

// A more robust guard on top of the page-load/window-load resets
// above: those try to catch the browser's scroll-restoration at
// specific points in time, but apparently it can still land later than
// all of them (probably tied to something async like web font
// loading finishing after 'load' already fired) — which showed up as
// the villa/caption/closing-section briefly visible UNDER the still-
// closed envelope, since those are scroll-driven independent of
// whether the envelope's been clicked. Instead of guessing the right
// moment, just actively watch: body has overflow:hidden until opened
// anyway, so the ONLY way scroll can become nonzero before that is the
// browser doing it to us, not the visitor scrolling — snap it back
// immediately, whenever it happens.
window.addEventListener('scroll', () => {
  if (!opened && window.scrollY !== 0) {
    window.scrollTo(0, 0);
  }
});

function startEnvelopeTransition() {
  const d = reduceMotion ? 0 : 1;
  gsap.timeline()
    .to(['.envelope-photo', '.open-line', '.from-eyebrow', '.from-names .letter'], {
      opacity: 0,
      duration: d,
      ease: 'power1.inOut'
    }, 0)
    .to('.sky-scene', {
      opacity: 1,
      duration: reduceMotion ? 0 : 1.2,
      ease: 'power1.inOut',
      // Unlock scrolling once the reveal has actually finished, not
      // before — scrolling mid-transition would fight the animation.
      // scrollTo(0,0) here too, not just at page load — a restored
      // scroll position can apparently still be "stored" on the
      // document even while body has overflow:hidden (which blocks
      // interactive scrolling but doesn't necessarily zero out that
      // stored value), so it was still showing up the instant overflow
      // switched to auto here, despite the page-load reset already
      // having run. Forcing it again at the exact moment scrolling
      // actually becomes possible closes that gap.
      onComplete: () => {
        window.scrollTo(0, 0);
        document.body.classList.add('unlocked');
      }
    }, reduceMotion ? 0 : 0.15);
}

document.querySelector('.stage').addEventListener('click', () => {
  if (opened) return;
  opened = true;

  // Was the intro already finished before this click, or did we just
  // force it to the end? Matters for pacing below — checked BEFORE
  // calling progress(1), which would otherwise always report 1.
  const introWasAlreadyDone = !introTl || introTl.progress() >= 0.999;

  // If the intro is still mid-flight (e.g. "Edgar & Vilma" hasn't
  // finished writing itself in yet), snap it to its completed state
  // instantly rather than cutting it off mid-reveal — progress(1) jumps
  // every queued tween straight to its end value in one synchronous
  // step, so envelope/eyebrow/every letter land at fully visible right
  // now. kill() afterward fully removes it so nothing keeps ticking.
  if (introTl) {
    introTl.progress(1);
    introTl.kill();
  }

  if (introWasAlreadyDone) {
    // Nothing was force-completed — the click should feel instant, not
    // laggy, so no artificial pause here.
    startEnvelopeTransition();
  } else {
    // We just snapped straight to "Edgar & Vilma" fully written in —
    // give that a beat to actually register before it dissolves away,
    // rather than the two happening back to back in the same instant.
    // This delay ONLY applies to this early-click case, on purpose.
    setTimeout(startEnvelopeTransition, reduceMotion ? 0 : 550);
  }
});

// ---- CALENDAR + COUNTDOWN — functional, not decorative, so this runs
// unconditionally (outside the reduced-motion gate above; nothing here
// is an animation reduced-motion would need to skip). ----

// All-day event, April 30th 2027. Google Calendar's all-day "dates"
// param and the .ics DTSTART/DTEND below both use an EXCLUSIVE end
// date, so "ends" 20270501 (May 1st) for an event that's just the 30th.
const EVENT_TITLE = "Edgar & Vilma's Wedding";
const EVENT_LOCATION = 'Orlando, FL, USA';
const EVENT_DETAILS = 'Save the date! Formal invitation to follow.';
const EVENT_START = '20270430';
const EVENT_END = '20270501';

const googleCalendarUrl =
  'https://calendar.google.com/calendar/render?action=TEMPLATE'
  + '&text=' + encodeURIComponent(EVENT_TITLE)
  + '&dates=' + EVENT_START + '/' + EVENT_END
  + '&details=' + encodeURIComponent(EVENT_DETAILS)
  + '&location=' + encodeURIComponent(EVENT_LOCATION);

// \r\n line endings per the iCalendar spec (RFC 5545) — most parsers
// tolerate bare \n, but this is what the spec actually asks for.
const icsContent = [
  'BEGIN:VCALENDAR',
  'VERSION:2.0',
  'BEGIN:VEVENT',
  'DTSTART;VALUE=DATE:' + EVENT_START,
  'DTEND;VALUE=DATE:' + EVENT_END,
  'SUMMARY:' + EVENT_TITLE,
  'LOCATION:' + EVENT_LOCATION,
  'DESCRIPTION:' + EVENT_DETAILS,
  'END:VEVENT',
  'END:VCALENDAR'
].join('\r\n');
const icsHref = 'data:text/calendar;charset=utf-8,' + encodeURIComponent(icsContent);

// Apple devices get a native one-tap "Add Event" flow from an .ics
// link; everything else (Android, Windows, Linux) gets a much smoother
// experience from the Google Calendar link than from a downloaded .ics
// they'd have to manually import. Primary button picks whichever fits
// the device; the secondary link always offers the other option, in
// case detection guesses wrong or someone just prefers it.
const isAppleDevice = /iPhone|iPad|iPod|Macintosh/.test(navigator.userAgent);
const calendarPrimary = document.getElementById('calendarPrimary');
const calendarAlt = document.getElementById('calendarAlt');

if (isAppleDevice) {
  calendarPrimary.href = icsHref;
  calendarPrimary.download = 'edgar-vilma-wedding.ics';
  calendarAlt.href = googleCalendarUrl;
  calendarAlt.target = '_blank';
  calendarAlt.rel = 'noopener';
  calendarAlt.textContent = 'Prefer Google Calendar?';
} else {
  calendarPrimary.href = googleCalendarUrl;
  calendarPrimary.target = '_blank';
  calendarPrimary.rel = 'noopener';
  calendarAlt.href = icsHref;
  calendarAlt.download = 'edgar-vilma-wedding.ics';
  calendarAlt.textContent = 'Prefer Apple Calendar or Outlook?';
}

// Countdown to April 30th 2027, Orlando local time (UTC-4, Eastern
// Daylight Time — the wedding is in April, DST is already in effect).
const WEDDING_DATE = new Date('2027-04-30T00:00:00-04:00');

function updateCountdown() {
  const msRemaining = Math.max(0, WEDDING_DATE - new Date());
  const days = Math.floor(msRemaining / 86400000);
  const hours = Math.floor(msRemaining / 3600000) % 24;
  const mins = Math.floor(msRemaining / 60000) % 60;
  const secs = Math.floor(msRemaining / 1000) % 60;
  document.getElementById('cdDays').textContent = String(days);
  document.getElementById('cdHours').textContent = String(hours).padStart(2, '0');
  document.getElementById('cdMins').textContent = String(mins).padStart(2, '0');
  document.getElementById('cdSecs').textContent = String(secs).padStart(2, '0');
}
updateCountdown();
setInterval(updateCountdown, 1000);
</script>
