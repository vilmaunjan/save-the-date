<!-- Fixed so it stays visible regardless of scroll position throughout
     the whole page, not just within .stage. Shows the OTHER language's
     code — i.e. reads "ES" while the page is in English, tap to switch
     to Spanish. Auto-detected on load (see the script); this is the
     manual override for whenever that guess is wrong. -->
<button id="langToggle" class="lang-toggle" type="button" aria-label="Switch language">ES</button>

<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/ScrollTrigger.min.js"></script>
<script>
// Browsers restore the previous scroll position on reload by default —
// with .stage's sticky-pinned choreography, landing mid-scroll on
// reload means the couple photo/villa/text are already partway (or all
// the way) through their transition even though you're looking at what
// should be the very first envelope screen. 'manual' stops the browser
// from doing that; the explicit scrollTo(0,0) is a belt-and-suspenders
// second guarantee in case scrollRestoration alone doesn't run in time
// on a given browser.
if ('scrollRestoration' in history) {
  history.scrollRestoration = 'manual';
}
window.scrollTo(0, 0);

// body starts visibility:hidden (see the CSS) specifically so this
// race can't produce a visible flash: the browser can restore a
// previous scroll position and paint that frame before this script has
// even run, no matter how early we call scrollTo. Instead of trying to
// out-race that, we wait it out — two rAFs give the browser's own
// restoration a couple of paint cycles to do whatever it's going to do
// — force scroll to 0 one last time after that, THEN reveal. Nothing
// gets shown to you until we're actually sure it's correct.
requestAnimationFrame(() => {
  requestAnimationFrame(() => {
    window.scrollTo(0, 0);
    document.body.classList.add('revealed');
  });
});
// Safety net: if anything above throws or a browser quirk stops the
// rAF chain from ever firing, don't leave the page permanently
// invisible — reveal it regardless after a short timeout.
setTimeout(() => document.body.classList.add('revealed'), 800);

// Declared out here (not with const inside the block below) so the click
// handler further down can reach in and kill it if the envelope gets
// clicked before the intro sequence finishes playing.
let introTl;

if (!window.matchMedia('(prefers-reduced-motion: reduce)').matches) {

  gsap.registerPlugin(ScrollTrigger);

  // ONE master timeline, one shared ScrollTrigger spanning the entire
  // .scroll-spacer, choreographing six beats in order (elongated from
  // the previous version — longer fade-in since the couple now rises
  // from further down, and a longer hold/transition/zoom generally):
  //
  //   0    -> 1.4  couple photo fades/rises in (now from 70px down,
  //                was 20px — longer duration to match the bigger
  //                distance, so it doesn't feel rushed)
  //   1.4  -> 2.2  HOLD — nothing moves, reads as "arrived and settled"
  //                before anything else starts
  //   2.2  -> 5.0  couple dissolves away right-to-left (--wipe/blur/
  //                opacity) and villa slides in from the right
  //                (x: 150% -> 0, landing at its resting spot —
  //                right: 6vw in the CSS, not dead center or left)
  //   2.2  -> 6.8  the save-block text (tagline + date, NOT the
  //                monogram — that stays centered) slides left
  //                (x: 0 -> -22vw, finishing at 6.8 not 5.0 — extended
  //                so it settles at the same moment the zoom below
  //                does, not early) to balance against villa settling
  //                on the right
  //   3.0  -> 6.8  villa's slow zoom (scale 1 -> 1.4 — was 1.12, barely
  //                perceptible, bumped up for a genuinely noticeable
  //                push-in) — starts partway through the slide-in above
  //                (was tried at the slide's exact midpoint, 3.6, then
  //                pulled slightly earlier), not simultaneously with
  //                it, so sliding and zooming read as two connected but
  //                distinct beats rather than everything happening at
  //                once from frame one
  //   3.0  -> 6.8  "Orlando, FL, USA" fades in RIGHT AS the zoom starts
  //                and finishes exactly when it does too (was ending at
  //                4.5 — extended to stay in step with the zoom's own
  //                end instead of settling early)
  //
  // Total timeline duration is 5.5 (the latest end time above, was 6.8
  // — trimmed so nothing keeps animating well past the slide-in's own
  // finish at 5.0) — the scrub maps that 1:1 onto .scroll-spacer's full
  // scroll distance, so .scroll-spacer's height (170dvh, also shrunk to
  // match) doesn't leave a stretch of scroll at the end where nothing's
  // actually still happening.
  // On phone AND tablet the villa moves below the text instead of
  // beside it (see the max-width:1024px block for .villa-image), so
  // there's no longer anything for the text to make room for by
  // shifting left — and -22vw was tuned against a wide desktop screen;
  // at anything narrower that same distance pushes the text far enough
  // left to clip against .stage's overflow:hidden (confirmed on an
  // 820px-wide iPad: the Spanish tagline's left edge landed 76px past
  // the viewport edge). Was gated at max-width:480px (phone only) —
  // widened to 1024px to match the villa-image breakpoint above, since
  // an ungated -22vw at tablet widths was exactly what caused the
  // overflow this whole fix is for.
  //
  // BREAKPOINT VALUES NOW LIVE IN CSS MEDIA QUERIES, not JS.
  // CSS media queries re-evaluate live on every resize/rotation, so
  // the correct --shift-x / --shift-y is always current with no JS
  // involvement. GSAP now tweens two unitless 0→1 drivers (--shift-px,
  // --shift-py) registered via @property; the transform is assembled
  // in CSS via calc(). Two separate drivers preserve the two different
  // tween start times (2.2 for x, 3.0 for y) that were present in the
  // old function-based tweens.
  //
  // Previous approach: JS helper functions (isPhoneLandscape, isNarrowLayout,
  // saveBlockShift, saveBlockRise) fed the tween values directly, and a
  // villaTl.invalidate() resize listener re-evaluated them after rotation.
  // invalidate() was the bug: it re-baselined every tween's start values from
  // the live mid-animation DOM (replacing "start = rest position" with
  // "start = wherever the animation currently is"), so scrolling back up left
  // the scene frozen at whatever transform it had reached mid-scroll. It fired
  // during ordinary phone scrolling because address-bar collapse dispatches
  // resize — not just on deliberate orientation changes.
  gsap.timeline({
    scrollTrigger: {
      trigger: '.scroll-spacer',
      start: 'top bottom',
      end: 'bottom bottom',
      // History: 0.3 -> 0.6 (smoothed fast flings, but caused visible
      // lag on slow scrolls — the animation trails up to 0.6s behind
      // actual scroll position, which reads as "I moved a lot, nothing
      // changed") -> 0.35 (still meaningfully laggy). The actual fix
      // was the dropped blur filter above (removed, not just lightened)
      // plus the @property registration on --wipe — those cut the real
      // per-frame rendering cost that was causing dropped frames in the
      // first place. scrub was never the right lever for that; a low
      // value here just means "track scroll position closely," which
      // is what you actually want once the per-frame cost is
      // reasonable.
      scrub: 0.2
    }
  })
    .to('.sky-photo, .sky-scrim', { opacity: 1, y: 0, ease: 'none', duration: 1.4 }, 0)
    // Was a physical x:'-100%' slide — swapped for a right-to-left
    // dissolve-wipe (--wipe, see the CSS) plus a growing blur, so it
    // reads as falling apart/vanishing in place rather than sliding
    // off-screen. 115% (not 100%) on --wipe accounts for the mask's own
    // 22-point feather, so the erased region actually reaches fully
    // past the left edge by the end instead of leaving a barely-visible
    // sliver. The opacity fade stays too, layered on top.
    //
    // Dropped the animated blur entirely (was 10px, then 5px, still too
    // costly) — this was the actual root cause of the choppiness/lag,
    // not the scrub value. Animated filter:blur is one of the most
    // expensive things a browser recomputes per frame, and stacked on
    // top of an animated mask on a large real photo (couple-2.webp),
    // it was eating enough frame budget to visibly drop frames — no
    // scrub number fixes dropped frames, scrub only changes how the
    // animation interpolates BETWEEN frames that do render. The mask
    // wipe + opacity fade alone still read as a soft dissolve, just
    // without the extra blur layered on.
    .to('.sky-photo, .sky-scrim', { '--wipe': '115%', opacity: 0, ease: 'none', duration: 2.8 }, 2.2)
    // x:0 lands it exactly at the CSS's own resting position
    // (right: 6vw) — the 150% starting offset lives in the CSS's base
    // transform, not here. Spans 2.2 -> 5.0.
    .to('.villa-image', { x: '0%', ease: 'none', duration: 2.8 }, 2.2)
    // Was 3.6 (the slide-in's exact midpoint) — pulled earlier to 3.0,
    // so the zoom kicks in a bit sooner relative to the slide instead of
    // waiting all the way to the halfway mark. Scale target 1.4 for a
    // genuinely noticeable push-in. Duration 2.5 (ending at 5.5) — was
    // stretched to end at 6.8, well past the slide-in's own 5.0 finish,
    // which meant a long stretch of extra scroll distance for very
    // little visible change. 5.5 is just a touch past the slide-in
    // finishing (5.0), enough to read as "still settling in" rather
    // than snapping dead the instant the slide stops, without dragging
    // on for its own separate scroll distance.
    .to('.villa-image', { scale: 1.4, ease: 'none', duration: 2.5 }, 3.0)
    // .monogram deliberately left out here — stays centered while only
    // the save-block text shifts left, per feedback (desktop only —
    // --shift-x is 0vw on mobile, see the CSS media queries). Ends at
    // 5.5, matching the zoom's end point.
    // Tweens the unitless 0→1 x-driver; the actual distance comes from
    // --shift-x in CSS (set per breakpoint). Two separate drivers (not
    // one) because the x and y tweens have deliberately different
    // start times (2.2 vs 3.0) that must be preserved independently.
    .to('.save-block', { '--shift-px': 1, ease: 'none', duration: 3.3 }, 2.2)
    // Separate tween (not merged into the one above) because it's
    // timed differently — starts at 3.0, matching the villa's zoom,
    // not 2.2 like the horizontal shift. --shift-y is 0vh on desktop
    // so harmless there. Ends at 5.5, same as the zoom.
    .to('.save-block', { '--shift-py': 1, ease: 'none', duration: 2.5 }, 3.0)
    // Shifted along with the zoom above (now 3.0), so it still appears
    // the instant the zoom starts. Ends at 5.5, in step with the zoom.
    .to('.villa-caption', { opacity: 1, ease: 'none', duration: 2.5 }, 3.0);

  // Debounced ScrollTrigger.refresh() on resize/orientationchange.
  //
  // This is NOT the old villaTl.invalidate() handler coming back —
  // invalidate() was the bug (it re-baselined every tween's recorded
  // start value from the live mid-animation DOM, so the scrubbed
  // timeline could never reverse) and it stays deleted. refresh() is a
  // different call that only recalculates each trigger's start/end
  // scroll positions; it was tested in isolation, before and after that
  // fix, and causes no jump and no loss of reversal.
  //
  // It was removed alongside invalidate() on the reasoning that
  // ScrollTrigger already auto-refreshes on resize by default. That
  // holds on desktop — verified — but not reliably on iOS Safari, where
  // rotation plus the collapsing address bar fires resize repeatedly
  // while layout is still settling, so GSAP can recompute against
  // transient dimensions and then never correct itself. The visible
  // symptom was .closing-section (formal-invitation note, calendar
  // buttons, countdown) staying invisible after a few scrolls and
  // rotations, iPhone only, never Android: it starts at opacity 0 in
  // CSS and is revealed ONLY by a ScrollTrigger at 'top 85%', so a
  // stale start position means it simply never fades in.
  //
  // Positions do drift even without rotation — measured 30px of
  // staleness in portrait on a page that had only been scrolled — and
  // nothing else in the page re-syncs them.
  //
  // 250ms (the old handler used 150ms) because iOS fires resize several
  // times in quick succession as the browser chrome settles after a
  // rotation; this waits for the last one rather than refreshing against
  // an intermediate viewport. orientationchange is listened to as well
  // as resize, since iOS does not guarantee a usefully-timed resize for
  // every rotation.
  // Width-gated: a phone fires resize every time its address bar or
  // bottom bar slides away during ordinary scrolling, and that changes
  // the HEIGHT only. Refreshing on those is both pointless (the pin math
  // is in svh, which by definition does not move when the bars do) and
  // actively harmful - a refresh mid-gesture recalculates pin boundaries
  // underneath a scroll already in progress, which is the jump reported
  // as content shifting when the toolbar collapses.
  //
  // A rotation always changes the width, so gating on width keeps the
  // case this handler exists for (see the commit that restored it: stale
  // trigger positions left .closing-section permanently invisible on
  // iPhone) while ignoring the toolbar. orientationchange stays wired up
  // unconditionally as a backstop, since iOS does not guarantee a
  // usefully-timed resize for every rotation.
  let refreshDebounce;
  let lastWidth = window.innerWidth;
  const doRefresh = () => {
    clearTimeout(refreshDebounce);
    refreshDebounce = setTimeout(() => {
      lastWidth = window.innerWidth;
      ScrollTrigger.refresh();
    }, 250);
  };
  window.addEventListener('resize', () => {
    if (window.innerWidth === lastWidth) return;   // height-only: browser chrome, not a rotation
    doRefresh();
  });
  window.addEventListener('orientationchange', doRefresh);

  // .closing-section: a plain fade+rise the moment it scrolls into
  // view, not tied to the master timeline above — it's not part of the
  // .stage choreography (it's not even inside .stage), it just sits in
  // normal flow and gets revealed once, like a simpler version of the
  // reveals used elsewhere on the page. toggleActions 'play none none
  // reverse' means it plays forward once you scroll to it and reverses
  // if you scroll back up past it, rather than the scrub-tied,
  // exactly-follows-your-finger motion the scenes above use.
  gsap.to('.closing-section', {
    opacity: 1,
    y: 0,
    duration: 1,
    ease: 'power2.out',
    scrollTrigger: {
      trigger: '.closing-section',
      start: 'top 85%',
      toggleActions: 'play none none reverse'
    }
  });

  // "Scroll for more" — first attempt tied this to the master villa
  // timeline above (scrub-linked, fading out over its last stretch,
  // ending exactly when that timeline reached its own end). Wrong
  // anchor: .scroll-spacer's actual scroll distance runs longer than
  // the villa content needs to finish animating, so that fired while
  // .stage was still pinned and .closing-section (the calendar/
  // countdown) hadn't appeared yet — the hint vanished while there was
  // still real content ahead, exactly the "gone before I've even seen
  // the calendar" complaint it was meant to avoid. Tied to the SAME
  // trigger as .closing-section's own reveal instead, so it only fades
  // once the calendar section has actually started coming into view.
  gsap.to('.scroll-hint', {
    opacity: 0,
    duration: 0.6,
    ease: 'power1.out',
    scrollTrigger: {
      trigger: '.closing-section',
      start: 'top 85%',
      toggleActions: 'play none none reverse'
    }
  });

  /*
    Simple page-load sequence (no scroll yet — first beat of what will
    grow into a longer scroll-driven piece later):

      0.0s          envelope fades/settles in, full-bleed
      ~0.7s         "Open the invitation" fades in at the bottom
      ~0.9s         "A Love letter from" fades in at the top
      ~1.15s        "Edgar & Vilma" writes itself in one letter at a
                    time, like a signature

    "A Love letter from" no longer waits for "Open the invitation" to
    fully finish (that was 1.6s in) — it starts sooner now, overlapping
    the tail end of that reveal instead of queuing strictly after it.
    Assigned to `introTl` (not a bare const) so the click handler below
    can kill it outright.
  */
  introTl = gsap.timeline({ defaults: { ease: 'power2.out' } });

  introTl.to('.envelope-photo', { opacity: 1, scale: 1, duration: 1.1 }, 0)
    .to('.open-line', { opacity: 1, y: 0, duration: 0.9 }, 0.7)
    // Duque fades in alongside "Click to open invitation" — same
    // start time and duration as the tween above, so he settles in
    // with the text rather than appearing on his own separate beat.
    .to('.duque-rest', { opacity: 1, duration: 0.9 }, 0.7)
    .to('.from-eyebrow', { opacity: 1, duration: 0.7 }, 0.9)
    // Per-letter "writing" reveal — each character of "Edgar & Vilma"
    // fades in on its own, staggered, rather than the whole name
    // appearing at once.
    .to('.from-names .letter', {
      opacity: 1,
      duration: 0.35,
      stagger: 0.055,
      ease: 'power1.out'
    }, 1.15);
}

/* ---- CLICK: envelope fades out, sky + birds fade in ----
   Works regardless of reduced-motion (the intro sequence above is
   gated, this isn't) — reduced-motion users just get an instant swap
   (duration 0) instead of an animated crossfade. Guarded with `opened`
   so a second click can't restart/stack the transition. */
let opened = false;
const reduceMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;

// A more robust guard on top of the page-load/window-load resets
// above: those try to catch the browser's scroll-restoration at
// specific points in time, but apparently it can still land later than
// all of them (probably tied to something async like web font
// loading finishing after 'load' already fired) — which showed up as
// the villa/caption/closing-section briefly visible UNDER the still-
// closed envelope, since those are scroll-driven independent of
// whether the envelope's been clicked. Instead of guessing the right
// moment, just actively watch: body has overflow:hidden until opened
// anyway, so the ONLY way scroll can become nonzero before that is the
// browser doing it to us, not the visitor scrolling — snap it back
// immediately, whenever it happens.
window.addEventListener('scroll', () => {
  if (!opened && window.scrollY !== 0) {
    window.scrollTo(0, 0);
  }
});

function startEnvelopeTransition() {
  const d = reduceMotion ? 0 : 1;
  gsap.timeline()
    .to(['.envelope-photo', '.open-line', '.from-eyebrow', '.from-names .letter', '.oliver-run', '.ball-run', '.duque-rest'], {
      opacity: 0,
      duration: d,
      ease: 'power1.inOut'
    }, 0)
    .to('.sky-scene', {
      opacity: 1,
      duration: reduceMotion ? 0 : 1.2,
      ease: 'power1.inOut',
      // Unlock scrolling once the reveal has actually finished, not
      // before — scrolling mid-transition would fight the animation.
      // scrollTo(0,0) here too, not just at page load — a restored
      // scroll position can apparently still be "stored" on the
      // document even while body has overflow:hidden (which blocks
      // interactive scrolling but doesn't necessarily zero out that
      // stored value), so it was still showing up the instant overflow
      // switched to auto here, despite the page-load reset already
      // having run. Forcing it again at the exact moment scrolling
      // actually becomes possible closes that gap.
      onComplete: () => {
        window.scrollTo(0, 0);
        document.body.classList.add('unlocked');
      }
    }, reduceMotion ? 0 : 0.15);
}

document.querySelector('.stage').addEventListener('click', () => {
  if (opened) return;
  opened = true;

  // Was the intro already finished before this click, or did we just
  // force it to the end? Matters for pacing below — checked BEFORE
  // calling progress(1), which would otherwise always report 1.
  const introWasAlreadyDone = !introTl || introTl.progress() >= 0.999;

  // If the intro is still mid-flight (e.g. "Edgar & Vilma" hasn't
  // finished writing itself in yet), snap it to its completed state
  // instantly rather than cutting it off mid-reveal — progress(1) jumps
  // every queued tween straight to its end value in one synchronous
  // step, so envelope/eyebrow/every letter land at fully visible right
  // now. kill() afterward fully removes it so nothing keeps ticking.
  if (introTl) {
    introTl.progress(1);
    introTl.kill();
  }

  if (introWasAlreadyDone) {
    // Nothing was force-completed — the click should feel instant, not
    // laggy, so no artificial pause here.
    startEnvelopeTransition();
  } else {
    // We just snapped straight to "Edgar & Vilma" fully written in —
    // give that a beat to actually register before it dissolves away,
    // rather than the two happening back to back in the same instant.
    // This delay ONLY applies to this early-click case, on purpose.
    setTimeout(startEnvelopeTransition, reduceMotion ? 0 : 550);
  }
});

// ---- LANGUAGE (EN/ES) — functional, not decorative, so this runs
// unconditionally (outside the reduced-motion gate above). Auto-detects
// from the browser's language setting on first visit, remembers a
// manual override after that. One HTML file with both languages baked
// in and swapped via textContent — not two separate pages — so the
// GSAP timelines above (which target elements by class, never by their
// text) don't care which language is showing; nothing about the
// scroll choreography needs duplicating per language. ----

const TRANSLATIONS = {
  en: {
    pageTitle: 'A Love Letter — Edgar & Vilma',
    openLine: 'Click to open invitation',
    fromEyebrow: 'A Love letter from',
    saveEyebrow: "We're Getting Married",
    saveTagline: 'Save The Date',
    saveDate: 'April 30th, 2027',
    scrollHint: 'Scroll for more',
    invitationNote: 'Formal invitation to follow',
    calendarBtn: 'Add to calendar',
    calendarAltGoogle: 'Prefer Google Calendar?',
    calendarAltApple: 'Prefer Apple Calendar or Outlook?',
    cdDays: 'Days',
    cdHours: 'Hours',
    cdMins: 'Min',
    cdSecs: 'Sec',
    eventTitle: "Edgar & Vilma's Wedding",
    eventDetails: 'Save the date! Formal invitation to follow.',
    monogramAria: 'Edgar and Vilma monogram',
    envelopeAria: 'Cream wedding invitation envelope with a wax seal monogrammed E and V',
    skyPhotoAria: 'Edgar and Vilma on the beach',
    villaAria: 'Watercolor illustration of the Tuscan-style villa',
    countdownAria: 'Countdown to the wedding'
  },
  es: {
    pageTitle: 'Una Carta de Amor — Edgar & Vilma',
    openLine: 'Click para abrir la invitación',
    fromEyebrow: 'Una carta de amor de',
    saveEyebrow: '¡Nos Casamos!',
    saveTagline: 'Reserva La Fecha',
    saveDate: '30 de abril de 2027',
    scrollHint: 'Desliza para ver más',
    invitationNote: 'La invitación formal llegará pronto',
    calendarBtn: 'Añadir al calendario',
    calendarAltGoogle: '¿Prefieres Google Calendar?',
    calendarAltApple: '¿Prefieres Apple Calendar u Outlook?',
    cdDays: 'Días',
    cdHours: 'Horas',
    cdMins: 'Min',
    cdSecs: 'Seg',
    eventTitle: 'Boda de Edgar y Vilma',
    eventDetails: '¡Reserva la fecha! La invitación formal llegará pronto.',
    monogramAria: 'Monograma de Edgar y Vilma',
    envelopeAria: 'Sobre de invitación de boda color crema con un sello de cera con las iniciales E y V',
    skyPhotoAria: 'Edgar y Vilma en la playa',
    villaAria: 'Ilustración en acuarela de una villa de estilo toscano',
    countdownAria: 'Cuenta regresiva para la boda'
  }
};

// EVENT_LOCATION isn't in TRANSLATIONS — a place name, kept the same in
// both languages (this is the actual practice for city/venue names,
// not something that gets translated). All-day event, April 30th 2027;
// Google Calendar's all-day "dates" param and the .ics DTSTART/DTEND
// below both use an EXCLUSIVE end date, so "ends" 20270501 (May 1st)
// for an event that's just the 30th.
const EVENT_LOCATION = 'Orlando, FL, USA';
const EVENT_START = '20270430';
const EVENT_END = '20270501';

const isAppleDevice = /iPhone|iPad|iPod|Macintosh/.test(navigator.userAgent);
const calendarPrimary = document.getElementById('calendarPrimary');
const calendarAlt = document.getElementById('calendarAlt');
const langToggle = document.getElementById('langToggle');

// Rebuilds the Google Calendar / .ics links against whichever
// language's event title+details are currently active, then re-applies
// the Apple-vs-everything-else button assignment (same logic as
// before, just wrapped in a function now so language switches can
// re-run it).
function applyCalendarLinks(lang) {
  const t = TRANSLATIONS[lang];

  const googleCalendarUrl =
    'https://calendar.google.com/calendar/render?action=TEMPLATE'
    + '&text=' + encodeURIComponent(t.eventTitle)
    + '&dates=' + EVENT_START + '/' + EVENT_END
    + '&details=' + encodeURIComponent(t.eventDetails)
    + '&location=' + encodeURIComponent(EVENT_LOCATION);

  // \r\n line endings per the iCalendar spec (RFC 5545) — most parsers
  // tolerate bare \n, but this is what the spec actually asks for.
  const icsContent = [
    'BEGIN:VCALENDAR',
    'VERSION:2.0',
    'BEGIN:VEVENT',
    'DTSTART;VALUE=DATE:' + EVENT_START,
    'DTEND;VALUE=DATE:' + EVENT_END,
    'SUMMARY:' + t.eventTitle,
    'LOCATION:' + EVENT_LOCATION,
    'DESCRIPTION:' + t.eventDetails,
    'END:VEVENT',
    'END:VCALENDAR'
  ].join('\r\n');
  const icsHref = 'data:text/calendar;charset=utf-8,' + encodeURIComponent(icsContent);

  calendarPrimary.textContent = t.calendarBtn;

  // Apple devices get a native one-tap "Add Event" flow from an .ics
  // link; everything else (Android, Windows, Linux) gets a much
  // smoother experience from the Google Calendar link than from a
  // downloaded .ics they'd have to manually import. Primary button
  // picks whichever fits the device; the secondary link always offers
  // the other option, in case detection guesses wrong or someone just
  // prefers it.
  if (isAppleDevice) {
    calendarPrimary.href = icsHref;
    calendarPrimary.download = 'edgar-vilma-wedding.ics';
    calendarAlt.href = googleCalendarUrl;
    calendarAlt.target = '_blank';
    calendarAlt.rel = 'noopener';
    calendarAlt.textContent = t.calendarAltGoogle;
  } else {
    calendarPrimary.href = googleCalendarUrl;
    calendarPrimary.target = '_blank';
    calendarPrimary.rel = 'noopener';
    calendarAlt.href = icsHref;
    calendarAlt.download = 'edgar-vilma-wedding.ics';
    calendarAlt.textContent = t.calendarAltApple;
  }
}

// Applies one language across every translated element on the page.
// Sets textContent only — never innerHTML or class — so this can't
// touch the per-letter <span> structure inside .from-names (that's a
// name, "Edgar & Vilma", and doesn't get translated at all) or any
// other element's animation-relevant markup.
function applyLanguage(lang) {
  const t = TRANSLATIONS[lang];
  document.title = t.pageTitle;
  document.documentElement.lang = lang;
  document.querySelector('.open-line').textContent = t.openLine;
  document.querySelector('.from-eyebrow').textContent = t.fromEyebrow;
  document.querySelector('.save-eyebrow').textContent = t.saveEyebrow;
  document.querySelector('.save-tagline').textContent = t.saveTagline;
  document.querySelector('.save-date').textContent = t.saveDate;
  document.querySelector('.scroll-hint').textContent = t.scrollHint;
  document.querySelector('.invitation-note').textContent = t.invitationNote;
  document.getElementById('cdDaysLabel').textContent = t.cdDays;
  document.getElementById('cdHoursLabel').textContent = t.cdHours;
  document.getElementById('cdMinsLabel').textContent = t.cdMins;
  document.getElementById('cdSecsLabel').textContent = t.cdSecs;
  document.getElementById('countdownRoot').setAttribute('aria-label', t.countdownAria);
  document.querySelector('.sky-photo').setAttribute('aria-label', t.skyPhotoAria);
  document.querySelector('.villa-image').setAttribute('aria-label', t.villaAria);
  document.querySelector('.monogram').setAttribute('aria-label', t.monogramAria);
  document.querySelector('.envelope-photo').setAttribute('aria-label', t.envelopeAria);
  applyCalendarLinks(lang);
  // Toggle shows the OTHER language's code — what tapping it switches
  // TO, not what's currently showing.
  langToggle.textContent = lang === 'en' ? 'ES' : 'EN';
  try {
    localStorage.setItem('siteLang', lang);
  } catch (e) {
    // Private browsing / storage disabled — language just won't be
    // remembered on the next visit, which is fine, not worth
    // interrupting anything over.
  }
}

// A manual choice from a previous visit always wins; otherwise, guess
// from the browser's own language setting. This is what makes "how
// will guests know" a non-issue for most people — the right language
// just shows up, no discovery required.
function detectInitialLang() {
  let saved = null;
  try {
    saved = localStorage.getItem('siteLang');
  } catch (e) {
    // Same as above — ignore, fall through to detection.
  }
  if (saved === 'en' || saved === 'es') return saved;
  const browserLang = (navigator.language || '').toLowerCase();
  return browserLang.startsWith('es') ? 'es' : 'en';
}

let currentLang = detectInitialLang();
applyLanguage(currentLang);

langToggle.addEventListener('click', () => {
  currentLang = currentLang === 'en' ? 'es' : 'en';
  applyLanguage(currentLang);
});

// ---- COUNTDOWN — the ticking numbers themselves aren't translated
// content, just runs alongside the language setup above. ----

// Countdown to April 30th 2027, Orlando local time (UTC-4, Eastern
// Daylight Time — the wedding is in April, DST is already in effect).
const WEDDING_DATE = new Date('2027-04-30T00:00:00-04:00');

function updateCountdown() {
  const msRemaining = Math.max(0, WEDDING_DATE - new Date());
  const days = Math.floor(msRemaining / 86400000);
  const hours = Math.floor(msRemaining / 3600000) % 24;
  const mins = Math.floor(msRemaining / 60000) % 60;
  const secs = Math.floor(msRemaining / 1000) % 60;
  document.getElementById('cdDays').textContent = String(days);
  document.getElementById('cdHours').textContent = String(hours).padStart(2, '0');
  document.getElementById('cdMins').textContent = String(mins).padStart(2, '0');
  document.getElementById('cdSecs').textContent = String(secs).padStart(2, '0');
}
updateCountdown();
setInterval(updateCountdown, 1000);
</script>

</body>
</html>
